adding:6px 12px; font:inherit; font-size:14px; color:#2a2521; cursor:pointer\">Close ✕<\u002Fbutton><\u002Fsc-if>\n        <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12px; color:#6e645a\">\n          <span style=\"display:flex; align-items:center; gap:6px\"><span style=\"width:8px; height:8px; border-radius:50%; background:{{ sel.branchColor }}\"><\u002Fspan>{{ sel.branchLabel }}<\u002Fspan>\n          <sc-if value=\"{{ showStatus }}\"><span style=\"padding:3px 9px; border:1px solid {{ sel.statusColor }}; color:{{ sel.statusColor }}; border-radius:20px\">{{ sel.statusLabel }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px; line-height:1.15\">{{ sel.name }}<\u002Fh2>\n          <div style=\"font-size:15px; color:#5e554c\">{{ sel.dates }}<\u002Fdiv>\n          <sc-if value=\"{{ sel.hasDateNote }}\"><div style=\"font-size:13px; line-height:1.5; color:#a0522d; text-wrap:pretty\">{{ sel.dateNote }}<\u002Fdiv><\u002Fsc-if>\n          <div style=\"font-size:14px; color:#6e645a\">{{ sel.place }}<\u002Fdiv>\n          <sc-if value=\"{{ sel.hasRel }}\"><div style=\"font-family:'Libre Caslon Text',Georgia,serif; font-style:italic; font-size:16px; color:#8a3324\">{{ sel.rel }}<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ sel.hasHyp }}\"><div style=\"padding:10px 12px; border:1px dashed #8a7f73; border-radius:3px; font-size:13px; line-height:1.5; color:#4a423b; text-wrap:pretty\">{{ sel.hypText }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ sel.hasTagline }}\"><p style=\"margin:0; font-size:15px; line-height:1.55; color:#2a2521; text-wrap:pretty\">{{ sel.tagline }}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ sel.hasNotes }}\"><p style=\"margin:0; font-size:14px; line-height:1.65; color:#4a423b; white-space:pre-wrap; text-wrap:pretty\">{{ sel.notes }}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ sel.hasPhoto }}\">\n          <div style=\"display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid #e6dccb\">\n            <div style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">Photographs<\u002Fdiv>\n            <sc-for list=\"{{ sel.photos }}\" as=\"ph\">\n              <div style=\"display:flex; flex-direction:column; gap:8px\">\n                <button sc-camel-on-click=\"{{ ph.onOpen }}\" style=\"position:relative; display:block; width:100%; padding:0; border:1px solid #d8cdbb; border-radius:3px; background:#2a2521; cursor:zoom-in; overflow:hidden\">\n                  <img src=\"{{ ph.src }}\" alt=\"{{ ph.caption }}\" style=\"display:block; width:100%; height:auto\">\n                  <sc-if value=\"{{ ph.hasRestored }}\"><span style=\"position:absolute; left:8px; bottom:8px; padding:4px 9px; border-radius:999px; background:#8a3324; color:#f5f0e6; font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase\">{{ ph.restoredLabel }}<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ ph.showRing }}\"><span style=\"position:absolute; left:{{ ph.meX }}; top:{{ ph.meY }}; width:22px; height:22px; transform:translate(-50%,-50%); border-radius:50%; border:2px solid #f5f0e6; box-shadow:0 0 0 2px #8a3324\"><\u002Fspan><\u002Fsc-if>\n                <\u002Fbutton>\n                <span style=\"font-size:13px; line-height:1.5; color:#5e554c; text-wrap:pretty\">{{ ph.caption }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ ph.onOpen }}\" style=\"align-self:flex-start; background:none; border:none; padding:0; font:inherit; font-size:14px; color:#8a3324; cursor:pointer; text-decoration:underline\">{{ ph.openLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ sel.groups }}\" as=\"g\">\n          <div style=\"display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid #e6dccb\">\n            <div style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">{{ g.label }}<\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n              <sc-for list=\"{{ g.items }}\" as=\"it\">\n                <button sc-camel-on-click=\"{{ it.onClick }}\" style=\"padding:6px 10px; background:#f5f0e6; border:1px solid #d8cdbb; border-radius:3px; font:inherit; font-size:13px; color:#2a2521; cursor:pointer\">{{ it.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ sel.hasEv }}\">\n          <div style=\"display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid #e6dccb\">\n            <div style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">Evidence<\u002Fdiv>\n            <sc-for list=\"{{ sel.ev }}\" as=\"e\">\n              <div style=\"display:flex; flex-direction:column; gap:3px\">\n                <span style=\"display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:{{ e.color }}\"><span style=\"width:7px; height:7px; border-radius:50%; background:{{ e.color }}; flex:none\"><\u002Fspan>{{ e.label }}<\u002Fspan>\n                <span style=\"font-size:14px; line-height:1.5; color:#2a2521; text-wrap:pretty\">{{ e.text }}<\u002Fspan>\n                <sc-if value=\"{{ e.hasRef }}\"><span style=\"font-size:12px; line-height:1.4; color:#8a7f73; overflow-wrap:anywhere\">{{ e.ref }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sel.hasSources }}\">\n          <div style=\"display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid #e6dccb\">\n            <div style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">Sources<\u002Fdiv>\n            <sc-for list=\"{{ sel.sources }}\" as=\"so\">\n              <sc-if value=\"{{ so.hasUrl }}\"><a href=\"{{ so.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:14px; line-height:1.4\">{{ so.label }}<\u002Fa><\u002Fsc-if>\n              <sc-if value=\"{{ so.noUrl }}\"><span style=\"font-size:14px; line-height:1.4; color:#4a423b\">{{ so.label }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n          <sc-if value=\"{{ sel.hasParents }}\">\n            <button sc-camel-on-click=\"{{ showAncestors }}\" style=\"padding:9px 14px; background:transparent; color:#2a2521; border:1px solid #bfb39f; border-radius:3px; font:inherit; font-size:14px; cursor:pointer\">Show their ancestors<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sel.hasKids }}\">\n            <button sc-camel-on-click=\"{{ showDescendants }}\" style=\"padding:9px 14px; background:transparent; color:#2a2521; border:1px solid #bfb39f; border-radius:3px; font:inherit; font-size:14px; cursor:pointer\">Show their descendants<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fmain>\n  <sc-if value=\"{{ lb.open }}\">\n    <div style=\"position:fixed; inset:0; z-index:60; background:rgba(28,24,21,0.94); overflow:auto; padding:clamp(14px,4vw,28px) clamp(10px,4vw,24px) 48px\">\n      <div style=\"max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:16px; color:#f5f0e6\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap\">\n          <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:26px\">{{ lb.title }}<\u002Fh2>\n          <div style=\"display:flex; gap:8px; flex-wrap:wrap\">\n            <sc-if value=\"{{ lb.hasMarkers }}\"><button sc-camel-on-click=\"{{ lb.toggleNums }}\" style=\"background:#f5f0e6; border:1px solid #f5f0e6; border-radius:3px; padding:9px 14px; font:inherit; font-size:14px; color:#2a2521; cursor:pointer\">{{ lb.numsLabel }}<\u002Fbutton><\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ lb.close }}\" style=\"background:none; border:1px solid rgba(245,240,230,0.5); border-radius:3px; padding:9px 14px; font:inherit; font-size:14px; color:#f5f0e6; cursor:pointer\">Close ✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; width:100%\">\n          <sc-if value=\"{{ lb.hasVersions }}\"><div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px\">\n            <sc-for list=\"{{ lb.versions }}\" as=\"v\"><button sc-camel-on-click=\"{{ v.onClick }}\" style=\"padding:7px 13px; border-radius:20px; border:1px solid {{ v.border }}; background:{{ v.bg }}; color:#f5f0e6; font:inherit; font-size:13px; cursor:pointer\">{{ v.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv><\u002Fsc-if>\n          <div style=\"position:relative; width:100%\">\n          <img src=\"{{ lb.src }}\" alt=\"{{ lb.title }}\" style=\"display:block; width:100%; height:auto; border-radius:2px\">\n          <sc-if value=\"{{ lb.showNums }}\"><sc-for list=\"{{ lb.markers }}\" as=\"m\">\n            <button sc-camel-on-click=\"{{ m.onClick }}\" title=\"{{ m.name }}\" style=\"position:absolute; left:{{ m.x }}; top:{{ m.y }}; width:{{ m.size }}; height:{{ m.size }}; transform:translate(-50%,-50%); border-radius:50%; border:2px solid #f5f0e6; background:{{ m.bg }}; color:#f5f0e6; font:inherit; font-size:11px; font-weight:600; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center\">{{ m.n }}<\u002Fbutton>\n          <\u002Fsc-for><\u002Fsc-if>\n          <sc-if value=\"{{ lb.showNums }}\"><sc-if value=\"{{ lb.hasActive }}\">\n            <div style=\"position:absolute; left:{{ lb.ax }}; top:{{ lb.ay }}; transform:{{ lb.labelTf }}; padding:5px 9px; background:#f5f0e6; color:#2a2521; border-radius:3px; font-family:'Libre Caslon Text',Georgia,serif; font-size:14px; white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,0.4); pointer-events:none\">{{ lb.activeName }}<\u002Fdiv>\n          <\u002Fsc-if><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lb.hasDesc }}\"><p style=\"margin:0; font-size:15px; line-height:1.6; color:#f5f0e6; text-wrap:pretty\">{{ lb.desc }}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ lb.hasCaption }}\"><p style=\"margin:0; font-size:14px; line-height:1.55; color:#e8c9a8; text-wrap:pretty\">{{ lb.caption }}<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ lb.hasMarkers }}\"><div style=\"display:flex; flex-direction:column; gap:16px\">\n        <div style=\"font-size:13px; color:rgba(245,240,230,0.75)\">Each number sits on the person's chest or just below their face, never on a face. Click a number or a name. Positions are approximate.<\u002Fdiv>\n        <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(245,240,230,0.7)\">{{ lb.frontLabel }}<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n          <sc-for list=\"{{ lb.legendFront }}\" as=\"l\">\n            <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"padding:6px 11px; border-radius:20px; border:1px solid {{ l.border }}; background:{{ l.bg }}; color:#f5f0e6; font:inherit; font-size:13px; cursor:pointer\">{{ l.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lb.activeHasPid }}\"><button sc-camel-on-click=\"{{ lb.openActive }}\" style=\"align-self:flex-start; background:none; border:none; padding:0; font:inherit; font-size:14px; color:#e8c9a8; cursor:pointer; text-decoration:underline\">See {{ lb.activeName }} in the tree →<\u002Fbutton><\u002Fsc-if>\n        <sc-if value=\"{{ lb.hasBack }}\"><div style=\"display:flex; flex-direction:column; gap:16px\">\n        <div style=\"font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(245,240,230,0.7)\">Back rows, left to right<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n          <sc-for list=\"{{ lb.legendBack }}\" as=\"l\">\n            <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"padding:6px 11px; border-radius:20px; border:1px solid {{ l.border }}; background:{{ l.bg }}; color:#f5f0e6; font:inherit; font-size:13px; cursor:pointer\">{{ l.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:13px; line-height:1.5; color:rgba(245,240,230,0.75); text-wrap:pretty\">Back-row placement follows the original caption's left-to-right order, including \"in front of Angie, Mary D. Ballinger\" and \"in front of Nora, Mae Chasteen.\" Which woman is the teacher is inferred from that order.<\u002Fp>\n        <\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv><\u002Fsc-if>\n        <p style=\"margin:0; font-size:12px; color:rgba(245,240,230,0.6)\">{{ lb.credit }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showStatus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Tree&quot;},&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;tree&quot;,&quot;descendants&quot;,&quot;renner&quot;,&quot;abneyDesc&quot;,&quot;lineage&quot;,&quot;people&quot;,&quot;photos&quot;,&quot;records&quot;,&quot;research&quot;,&quot;music&quot;,&quot;notables&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page&quot;},&quot;showResearchScreens&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Records&quot;}}\">\nclass Component extends DCLogic {\n  // What's new: add an entry at the TOP each time something is added. photo = filename in assets/photos, person = person id, tab = section.\n  static MUSIC_STORY = [\n    { h: 'The beginning', paras: [\"The roots of The Singing Renners were closely connected to Maple Grove Baptist Church near Orlando, Kentucky. Wendell Renner was a founding member of Maple Grove and spent nearly five decades serving the church as a deacon, Sunday school teacher and song leader. Gospel music was not simply a profession or hobby for the Renner family. It grew naturally from their church life and Christian faith.\", \"The exact year the family began performing publicly has not yet been established, but their recording history appears to predate 1980, and newspaper records confirm that The Singing Renners were an established gospel group by at least 1980. That year they were advertised as one of the featured groups at a three-day Gospel Singing Festival at Maple Grove Baptist Church, alongside the John Burke and Layman Trio and the Bryant Family.\"] },\n    { h: 'A true family group', img: 'asset' + 's/music/coming-back-back.jpg', paras: [\"The Singing Renners were exactly what their name suggested: a singing family. The Renner children grew up in the ministry, appearing on stage and eventually on recordings, in a long Southern Gospel tradition of families traveling together to share their faith through music.\", \"Two early 45-rpm records featured the youngest members. Tony Renner recorded The Little Country Boy, and Little Jonathan Renner sang Guardian Angel and He's Still Working on Me.\", \"The membership changed as the children grew older and other singers joined. A 1990 newspaper announcement introduced Michael Bryant Jr. as the Renners' newest member. Through those changes, the family stayed at the center of the group.\"] },\n    { h: 'The early recordings', img: 'asset' + 's/music/wilderness-cover.jpg', paras: [\"The family's first album, Coming Out of the Wilderness – Singing for Jesus, was released on Jordan Records of Covington, Kentucky. Its liner notes, by Maple Grove's pastor Rev. Lester Arnold, call it \\\"The Renner Family's first album\\\" and name the children Wendell Jr., Danny, Teresa, Paul (Tony), Melisa and Judy, Wendell's sister, \\\"who they have raised up and loved as their own.\\\"\", \"The second, I Believe He's Coming Back Like He Said, credits Virginia, Tammy, Wendell, Jonathan, Tony, Danny, Melissa, Teressa and Wendell Jr. Other early recordings included Headed for Glory and By Faith, which billed the group as \\\"The Singing Renners of Renfro Valley, Kentucky.\\\" These albums reflected the traditional Southern Gospel music of the family's early years: songs about heaven, family, perseverance, salvation and the hope of Christ.\"] },\n    { h: 'The Harvest Records years', img: 'asset' + 's/music/excited-cover.jpg', paras: [\"By the mid-1980s The Singing Renners had entered the best-documented period of their recording career. In 1985 they released Excited on Harvest Records of Hendersonville, Tennessee, produced by Eddie Crook. Federal copyright records independently document several songs from the album and identify The Singing Renners as the performers.\", \"One of those records shows the family's own musical contribution: Danny Renner is credited with the music for \\\"I Don't Want to Be Left.\\\" The Renners were not simply performing songs written by others. The family's own creativity became part of the catalog.\", \"In His Service followed in 1986, and New Direction in 1988. The title fit: by then the group's music had moved toward the contemporary Southern Gospel sound of the late 1980s. A Harvest Records 45 of \\\"You Ain't Seen Nothing Yet\\\" also survives.\"] },\n    { h: 'National radio airplay', paras: [\"By the late 1980s, the Renners' ministry was expanding beyond church appearances and album sales into Southern Gospel radio. \\\"God's Gonna Do It Again,\\\" from the 1986 album In His Service, appeared on the Singing News Official Traditional Airplay Chart in December 1987, reaching No. 68 nationally.\", \"The Singing News chart was compiled from Southern Gospel radio airplay and was one of the genre's principal measures of national exposure. It is documented evidence that the group's music was reaching radio audiences well beyond Kentucky. Other Renner singles may also have charted; the monthly charts from about 1984 to 1991 still need to be checked.\"] },\n    { h: '...because of love', img: 'asset' + 's/music/because-of-love-cover.jpg', paras: [\"In 1990 The Renners released ...because of love, produced by J.D. Miller and The Renners. It is currently the latest known full-length recording in the family catalog, which by then stretched from traditional church standards to the more contemporary arrangements of the early 1990s.\"] },\n    { h: 'More than records', paras: [\"The story of The Singing Renners cannot be told through albums alone. They were first and foremost a traveling gospel ministry. Newspaper advertisements through the 1980s and 1990s place them at churches, gospel festivals, homecomings and special singings. Wendell's obituary recalled that he toured the country with The Singing Renners for more than twenty years.\", \"Weekends could mean loading equipment, driving hours to a church or auditorium, setting up, singing, meeting people afterward, packing it all back up, and getting home before ordinary life began again the next week. For the Renners, that routine continued for years.\"] },\n    { h: 'The Happy Gospel Man', quote: '“The Happy Gospel Man”', paras: [\"For years Wendell was also a gospel radio personality on WRVK, where listeners knew him by that name. His life combined roles that might seem unrelated: businessman, father, church leader, singer, radio personality and traveling gospel musician. He helped establish Maple Grove Baptist Church and served it for nearly half a century, raised a large family with Virginia, built a successful masonry business, and spent more than twenty years singing alongside that family.\"] },\n    { h: 'A ministry becomes an organization', paras: [\"By the late 1980s the ministry was substantial enough to take on a formal structure. Public nonprofit records indicate that Singing Renners Inc. received recognition as a charitable organization in 1989. What began as a family singing together had become a traveling and recording organization with its own identity.\"] },\n    { h: 'Returning home', paras: [\"No matter how far the family traveled, Maple Grove and Rockcastle County stayed central to the story. Newspapers repeatedly advertised Renner appearances at Maple Grove Baptist Church and other nearby churches. In 1990, Maple Grove's homecoming featured The Renners, with Michael Bryant Jr. introduced as the newest member.\"] },\n    { h: 'The reunion years', paras: [\"Eventually the years of regular touring came to an end, but the family kept gathering to sing. In 2009 an announcement invited the public to hear \\\"The Singing Renner Family\\\" reunite for an annual birthday singing at Northside Baptist Church. In September 2011 another promoted The Singing Renners Reunion, described simply as \\\"a night of worship.\\\" That phrase may describe the purpose of the group better than anything else.\"] },\n    { h: 'Remembering Wendell Renner', paras: [\"Only a short time after the 2011 reunion, Wendell Renner died on 23 November 2011, at the age of 71. His obituary remembered a husband and father, a businessman, a founding member of Maple Grove Baptist Church, a deacon, a Sunday school teacher, a song leader, the Happy Gospel Man on WRVK, and a man who traveled the country for more than twenty years singing with his family as The Singing Renners.\"] },\n    { h: 'A family legacy', paras: [\"The Singing Renners belong to a generation of Southern Gospel groups whose history was rarely preserved in major music publications. Their story survives instead through vinyl records, cassette tapes, newspaper advertisements, church bulletins, copyright registrations, photographs, memories, and the people who heard them sing.\", \"Music became part of the Renner family's inheritance. Songs passed from parents to children. Children grew up on stages and in recording studios. Decades later, the recordings still preserve voices from another season of the family's life. The records remain. The photographs remain. The stories remain. And the music continues.\"] },\n    { h: 'Historical note', paras: [\"This history is still being reconstructed. Some early album dates, recording locations, personnel, musicians, producers and touring dates have not been conclusively documented. It combines the family's recordings and photographs with newspaper notices, copyright records, public records and family history, and will be expanded and corrected as more is found. Still to do: check the Singing News charts from about 1984 to 1991 for every Renner single.\"] }\n  ];\n  static MUSIC_ALBUMS = [\n    { title: 'Coming Out of the Wilderness – Singing for Jesus', artist: 'The Renner Family', meta: 'Date unknown · Jordan Records, Covington, KY · LP', n: 'First album', cover: 'asset' + 's/music/wilderness-cover.jpg', back: 'asset' + 's/music/wilderness-back.jpg',\n      note: 'The liner notes call it \"The Renner Family\\'s first album.\" Includes \"Oh, How I Love Jesus,\" sung by Tony and Teresa, who learned it from their first-grade teacher, Sister Rena Jordon.',\n      sides: [['Side one', ['Coming Out of the Wilderness', 'I Know', 'When I Wake Up', 'Jesus Will Outshine Them All', 'Remind Me']], ['Side two', ['Hallelujah Square', 'Oh, How I Love Jesus', 'Fussin\\' in the Camp', 'Maple Grove', 'Thank God for My Christian Home']]],\n      credits: 'Musicians: Joe Kirby, electric bass; Richard VanWinkle, piano and electric guitar; d(id, Object.assign({ name, sex, born, died, tagline, parents: parents || [null, null], branch: 'royal', status: 'pedigree', sources: [S.pdf] }, o || {}));\n    add('judith', { name: 'Judith A. M. Graves Clark', sex: 'f', born: 'c. 1774', died: '1853', branch: 'abney', status: 'pedigree', tagline: 'Wife of Rev. William Abney.', sources: [S.pdf, S.johnetta] });\n    upd('anneS', { parents: ['georgeStanley', 'eleanorSutton'], born: 'after 1471', died: 'after 1532', status: 'record', sources: [WT, S.pdf], tagline: 'Mother of Ellen Wolseley. Married John Wolseley around 1500.' });\n    rn('georgeStanley', 'George Stanley, Esq.', 'm', 'c. 1440', 'c. 1509', 'Lord of Hammerwich, Staffordshire; buried in Lichfield Cathedral.', null, { status: 'record', sources: [WTS] });\n    rn('eleanorSutton', 'Eleanor (Sutton) Stanley', 'f', 'c. 1439', 'c. 1513', 'Daughter of the 1st Baron Dudley. Widow of Sir Henry Beaumont before marrying George Stanley.', ['johnSutton', 'elizBerkeley'], { status: 'record', sources: [WTS] });\n    rn('johnSutton', 'John Sutton, 1st Baron Dudley', 'm', '25 Dec 1400', '30 Sep 1487', 'Soldier, diplomat and royal councillor; Knight of the Garter.', null, { notable: true, status: 'record', sources: [WPD],\n      notes: 'Fought in France during the Hundred Years\\' War and later in the Wars of the Roses. He carried the royal standard at King Henry V\\'s funeral in 1422, served as Lord Lieutenant of Ireland from 1428 to 1430, and advised King Henry VI. He lived at Dudley Castle.' });\n    rn('elizBerkeley', 'Elizabeth (Berkeley) Sutton', 'f', 'c. 1400', '1478', 'Lady Dudley. First married Edward Charleton, Lord of Powys.', ['johnBerkeley', 'betteshorne'], { status: 'record', sources: [WPD] });\n    rn('johnBerkeley', 'Sir John Berkeley of Beverston', 'm', '21 Jan 1352', '5 Mar 1428', 'Knight and Member of Parliament for Gloucestershire and Somerset.', ['thomasBerkeley', 'margaretMortimer'], { status: 'research', sources: [WPB, WTB],\n      notes: 'This is the weak link in the route to King John. The supplied pedigree runs through Margaret Mortimer as his mother. Most authorities — including Richardson\\'s Royal Ancestry, the History of Parliament and Wikipedia — say his mother was his father\\'s second wife, Katherine Clivedon. If they are right, this particular path to King John does not hold, although other paths through these families may exist.' });\n    rn('betteshorne', 'Elizabeth Betteshorne', 'f', '', '', 'Wife of Sir John Berkeley of Beverston.');\n    rn('thomasBerkeley', 'Thomas de Berkeley, 3rd Baron Berkeley', 'm', 'c. 1296', '27 Oct 1361', 'Lord of Berkeley Castle, \"Thomas the Rich.\"', null, { notable: true,\n      notes: 'The deposed King Edward II was held prisoner at Berkeley Castle in 1327 and died there while in Thomas\\'s custody — one of the most notorious episodes in English royal history. He married first Margaret Mortimer, and second Katherine Clivedon.' });\n    rn('katherineC', 'Katherine (Clivedon), Lady Berkeley', 'f', '', '1385', \"Thomas de Berkeley's second wife.\", null, { status: 'record', sources: [WPB], notes: \"Most authorities name her as Sir John Berkeley of Beverston's mother, rather than Margaret Mortimer.\" });\n    rn('margaretMortimer', 'Margaret Mortimer', 'f', '1304', '1337', \"Thomas de Berkeley's first wife. Her mother-line gives the pedigree its link to King John.\", ['rogerMarch', 'joanGen']);\n    rn('rogerMarch', 'Roger Mortimer, 1st Earl of March', 'm', '1287', '1330', 'The baron who overthrew a king.', ['edmundMort', null], { notable: true,\n      notes: 'Imprisoned in the Tower of London by Edward II, he escaped in 1323 and fled to France. There he allied with Edward\\'s queen, Isabella, and in 1326–27 they invaded England and forced the king from the throne. For three years Mortimer was the real ruler of England, until the young Edward III seized him and had him executed in 1330.' });\n    rn('joanGen', 'Joan de Geneville', 'f', '1286', '1356', 'Wife of Roger Mortimer; heiress of Ludlow and lands in Ireland.');\n    rn('edmundMort', 'Edmund Mortimer, 2nd Baron Wigmore', 'm', 'c. 1251', '1304', 'Marcher lord of Wigmore Castle on the Welsh border.', ['rogerWig', null]);\n    rn('rogerWig', 'Roger Mortimer, 1st Baron Wigmore', 'm', '1231', '1282', 'Powerful Marcher lord in the Welsh borderlands.', ['ralphMort', 'gwladys'], { notable: true,\n      notes: 'A leading royalist in the Barons\\' War. He helped Prince Edward (later Edward I) escape captivity in 1265 and fought at the Battle of Evesham, where Simon de Montfort was killed.' });\n    rn('ralphMort', 'Ralph de Mortimer', 'm', '', '1246', 'Lord of Wigmore; married the Welsh princess Gwladys Ddu.');\n    rn('gwladys', 'Gwladys Ddu', 'f', '', '1251', 'Welsh princess, \"Gwladys the Dark.\" Granddaughter of King John.', ['llywelyn', 'joanWales'], { notes: 'Her marriage to Ralph de Mortimer joined the royal house of Gwynedd to the Mortimers of the Welsh March.' });\n    rn('llywelyn', 'Llywelyn the Great', 'm', 'c. 1173', '1240', 'Prince of Gwynedd and the dominant ruler in Wales.', null, { notable: true, notes: 'Llywelyn ab Iorwerth united most of Wales under his rule and dealt with England as a near-equal. He married King John\\'s daughter Joan.' });\n    rn('joanWales', 'Joan, Lady of Wales', 'f', 'c. 1191', '1237', \"King John's daughter, born outside his marriage.\", ['kingJohn', null], { notable: true, notes: 'Married Llywelyn the Great and often acted as a go-between for Wales and England, negotiating with her father and later her half-brother, Henry III.' });\n    upd('kingJohn', { notable: true, tagline: 'King of England 1199–1216; sealed Magna Carta in 1215.', notes: 'Youngest son of Henry II and Eleanor of Aquitaine. He lost Normandy to France in 1204 and quarrelled with the Pope and his barons, who forced him to seal Magna Carta at Runnymede in 1215 — the charter now seen as a foundation of the rule of law.\\n\\nThe path from King John to the Abneys runs through his daughter Joan and the Mortimers, and depends on the disputed parentage of Sir John Berkeley of Beverston.' });\n    upd('henry2', { notable: true, notes: 'Ruled an \"Angevin Empire\" stretching from Scotland\\'s border to the Pyrenees. His reforms laid the groundwork of English common law. His quarrel with Archbishop Thomas Becket ended in Becket\\'s murder in Canterbury Cathedral in 1170.' });\n    upd('eleanor', { notable: true, notes: 'Duchess of Aquitaine in her own right; queen of France, then of England. She went on the Second Crusade, backed her sons\\' rebellion against Henry II, and was imprisoned by him for about 16 years. Mother of Richard the Lionheart and King John.' });\n    upd('geoffrey', { notable: true, notes: 'His habit of wearing a sprig of broom (planta genista) gave the Plantagenet dynasty its name. He conquered Normandy in the 1140s.' });\n    upd('empMatilda', { notable: true, parents: ['henry1', 'matildaS'], notes: \"First married the Holy Roman Emperor Henry V, hence \\\"Empress.\\\" Named her father's heir, she fought her cousin Stephen for the English crown in the civil war known as the Anarchy. She never ruled, but her son became Henry II.\" });\n    upd('henry1', { notable: true, notes: 'Built up the royal treasury and justice system. When his only legitimate son drowned in the White Ship disaster of 1120, the succession crisis that followed led to the Anarchy.' });\n    rn('matildaS', 'Matilda of Scotland', 'f', 'c. 1080', '1118', \"Henry I's queen; daughter of King Malcolm III and St. Margaret.\", ['malcolm3', 'stMargaret'], { notable: true, notes: 'Through her mother, a princess of the old English royal house, she carried the blood of the Anglo-Saxon kings into the Norman dynasty.' });\n    rn('malcolm3', 'Malcolm III, King of Scots', 'm', 'c. 1031', '1093', 'King of Scotland 1058–1093; overthrew Macbeth.', null, { notable: true, notes: 'The Malcolm of Shakespeare\\'s Macbeth. He killed Macbeth in 1057 and took the Scottish throne.' });\n    rn('stMargaret', 'St. Margaret of Scotland', 'f', 'c. 1045', '1093', 'Queen of Scots, later made a saint.', null, { notable: true, notes: 'An English princess of the House of Wessex, she fled to Scotland after the Norman Conquest and married Malcolm III. Known for her piety and charity, she was canonized in 1250.' });\n    upd('william', { notable: true, notes: 'Duke of Normandy who invaded England and won the Battle of Hastings in 1066, becoming its first Norman king. He ordered the Domesday Book survey of 1086.' });\n    upd('matildaF', { notable: true, notes: 'Queen of England from 1068 and trusted regent of Normandy while William was in England. Daughter of Baldwin V of Flanders.' });\n    upd('baldwin5', { parents: ['baldwin4', null], notable: true, tagline: 'Count of Flanders; regent of France.', notes: 'Served as regent for the young King Philip I of France — while his son-in-law William was conquering England.' });\n    rn('baldwin4', 'Baldwin IV, Count of Flanders', 'm', 'c. 980', '1035', '\"Baldwin the Bearded.\"', ['arnulf2', null]);\n    rn('arnulf2', 'Arnulf II, Count of Flanders', 'm', 'c. 961', '987', '', ['baldwin3', null]);\n    rn('baldwin3', 'Baldwin III, Count of Flanders', 'm', 'c. 940', '962', 'Died young, before his father.', ['arnulf1', null]);\n    rn('arnulf1', 'Arnulf I, Count of Flanders', 'm', 'c. 890', '965', '\"Arnulf the Great,\" who greatly enlarged Flanders.', ['baldwin2', 'aelfthryth']);\n    rn('baldwin2', 'Baldwin II, Count of Flanders', 'm', 'c. 865', '918', 'Defended Flanders against the Vikings.', ['baldwin1', 'judithFr']);\n    rn('aelfthryth', 'Ælfthryth of Wessex', 'f', 'c. 877', '929', 'Daughter of Alfred the Great; wife of Baldwin II.', ['alfred', null], { notable: true });\n    rn('alfred', 'Alfred the Great', 'm', '849', '899', 'King of Wessex 871–899; the only English king called \"the Great.\"', null, { notable: true, notes: 'Held off the Viking Great Army, built a network of fortified towns (burhs), and promoted learning and law in English. He laid the foundation for a united England.' });\n    rn('baldwin1', 'Baldwin I \"Iron Arm\", Count of Flanders', 'm', '', '879', 'First Count of Flanders.', null, { notable: true, notes: 'Eloped with the king\\'s daughter Judith in 862. Charles the Bald was furious, but eventually accepted the marriage and made Baldwin a count — the start of Flanders.' });\n    rn('judithFr', 'Judith of Flanders', 'f', 'c. 844', 'c. 870', 'Carolingian princess; twice an English queen.', ['charlesBald', 'ermentrude'], { notable: true, notes: 'Daughter of Charles the Bald. Married as a girl to the English king Æthelwulf (Alfred the Great\\'s father), then to his son Æthelbald. Widowed again, she eloped with Baldwin Iron Arm.' });\n    rn('ermentrude', 'Ermentrude of Orléans', 'f', '823', '869', 'Queen of the West Franks; wife of Charles the Bald.');\n    upd('charlesBald', { parents: ['louis', 'judithBav'], notable: true, notes: 'When the empire was divided in 843 (Treaty of Verdun), he received West Francia — the core of what became France. Crowned emperor in 875.' });\n    rn('judithBav', 'Judith of Bavaria', 'f', 'c. 797', '843', \"Louis the Pious's second wife; mother of Charles the Bald.\");\n    upd('louis', { parents: ['charlemagne', 'hildegard'], notable: true, notes: 'Charlemagne\\'s only surviving legitimate son and successor as emperor. Quarrels among his sons led to the empire\\'s division after his death.' });\n    rn('hildegard', 'Hildegard', 'f', 'c. 758', '783', \"Charlemagne's queen; mother of Louis the Pious.\");\n    upd('charlemagne', { parents: ['pepin', null], notable: true, notes: 'King of the Franks from 768 and ruler of most of western Europe. Crowned emperor by Pope Leo III on Christmas Day 800. He encouraged a revival of learning and is often called the \"Father of Europe.\"' });\n    rn('pepin', 'Pepin the Short', 'm', 'c. 714', '768', 'First Carolingian King of the Franks, crowned 751.', null, { notable: true });\n    pairs.push(['georgeStanley', 'eleanorSutton'], ['johnSutton', 'elizBerkeley'], ['johnBerkeley', 'betteshorne'], ['thomasBerkeley', 'margaretMortimer'], ['thomasBerkeley', 'katherineC'], ['rogerMarch', 'joanGen'], ['ralphMort', 'gwladys'], ['llywelyn', 'joanWales'], ['henry1', 'matildaS'], ['malcolm3', 'stMargaret'], ['baldwin2', 'aelfthryth'], ['baldwin1', 'judithFr'], ['charlesBald', 'ermentrude'], ['louis', 'judithBav'], ['charlemagne', 'hildegard']);\n    const MC = { label: '1914 Kentucky marriage record — Wesley Abney & Chessie Anglin', url: '' };\n    const FSJ = { label: 'FamilySearch — Wesley Abney Jr. (K8TC-23R)', url: 'https://ancestors.familysearch.org/en/K8TC-23R/wesley-abney-jr-1894-1910' };\n    const FSS = { label: 'FamilySearch — Wesley Abney Sr. (KV2Z-MPC)', url: 'https://ancestors.familysearch.org/en/KV2Z-MPC/wesley-abney-1861-1934' };\n    const BRY = { label: 'Descendants of Jesse Bryant — Rockcastle KyGenWeb', url: 'https://kygenweb.net/rockcastle/family/bryant/bryant01.htm' };\n    const PL = { label: 'PeopleLegacy — Robert Lewis Abney (spouse data unreliable)', url: 'https://peoplelegacy.com/robert_lewis_abney-47117G1' };\n    const VISIT = { label: \"Jon's photographs, Johnetta Cemetery visit, 30 Sep 2026\", url: '' };\n    const BAKER = { label: 'Rockcastle marriage index — Chessie M. Abney to W. M. Baker, 1920 (Book 30, p. 114)', url: '' };\n    const CHO = { label: 'Obituary of Chessie Anglin (as reported)', url: '' };\n    upd('bobAbney', { parents: ['wesleyJr', 'chessie'], place: 'Born Disputanta, Rockcastle Co., KY; lived in Covington, KY', status: 'record', sources: [S.wendell, FSJ, PL],\n      tagline: \"Jon's grandfather — Wendell's father, through Fannie Renner. Married to Edith Renner.\",\n      notes: \"Born 18 Jul 1915 near Disputanta, Rockcastle County; died 21 Aug 1983; buried at Floral Hills Memorial Gardens, Taylor Mill, Kentucky.\\n\\nHe was married to Edith Sarah Renner. Jon's line does not come through Edith: Bob's son Wendell was born to Edith's younger sister, Fannie Renner, who was a teenager at the time — which is why Wendell carried the Renner name.\\n\\nHis parents were Wesley Abney Jr. and Chessie Mae Anglin. Their 1914 marriage is proven by the original record, and FamilySearch lists Bob as their son. A record for Bob himself naming his father — his birth record or original Social Security application (SS-5) — would make it final.\\n\\nPeopleLegacy confirms his dates, burial and his mother Chessie, but wrongly gives his wife as \\\"Mildred Irene Renner Abney,\\\" mixing up his wife and daughter. Its family data shouldn't be used.\" });\n    upd('edith', { name: 'Edith Sarah (Renner) Abney', rel: \"Your great-aunt — Bob Abney's wife, not your direct ancestor\", sources: [HW, FO],\n      tagline: \"Bob Abney's wife and Fannie's older sister. Not in Jon's direct line.\",\n      notes: \"Mother recorded as Charlotte \\\"Lila\\\" Suttles/Settles. Fannie's obituary names her sister as Mrs. Edith Abney of Covington, Kentucky.\\n\\nEdith was Bob's wife, but Jon descends from Bob and her sister Fannie — so Edith is Jon's great-aunt, not his grandmother.\" });\n    add('wesleyJr', { name: 'Wesley Abney Jr.', sex: 'm', born: 'c. 1894', died: 'Unknown — not 1910', place: 'Rockcastle County, KY', branch: 'abney', status: 'likely', parents: ['wesley', 'louisa'], sources: [MC, FSJ, S.johnetta],\n      tagline: \"Bob Abney's father; Jon's great-grandfather. Married Chessie Anglin on 5 Feb 1914.\",\n      notes: \"The 1914 Rockcastle County marriage record shows Wesley Abney, age 19, a farmer, first marriage, son of Wesley Abney and Louisa Ann, marrying Chessie Anglin, age 20, on 5 Feb 1914. Age 19 means he was born between Feb 1894 and Feb 1895.\\n\\nThe Johnetta Cemetery transcription lists a \\\"Little Wesly\\\" Abney, 1894–1910, and FamilySearch repeats the 1910 death. That date is impossible: he was alive and marrying in 1914. FamilySearch's own profile contradicts itself, giving both the 1910 death and the 1914 marriage. His real death date is unknown.\\n\\nBob was born in July 1915, about 17 months after the marriage. That makes Wesley Jr. Bob's father on very strong evidence, but not yet a record naming Bob's father directly.\\n\\nWhat happened to him: he was alive in Feb 1914. A 1920 census entry reportedly shows Chessie as a widow, and she remarried in Aug 1920. So he most likely died, or the marriage ended, between 1915 and 1920. A Wesley Abney mentioned in the 31 Mar 1916 Mount Vernon Signal may be him.\\n\\nOn his 2026 visit Jon could not find a readable stone for \\\"Little Wesly.\\\" Many of the oldest graves are plain rocks or badly weathered, so that proves nothing either way.\" });\n    upd('chessie', { name: 'Chessie Mae (Anglin) Abney Baker Thomas', born: 'c. 1894', died: '2 Jan 1956', place: 'Rockcastle County, KY', parents: ['johnAAnglin', 'maryAnglin'], status: 'likely', sources: [MC, FSJ, BAKER, CHO, PL],\n      tagline: \"Bob Abney's mother; Jon's great-grandmother.\",\n      notes: \"Married Wesley Abney Jr. on 5 Feb 1914 (original marriage record). Their son Robert Lewis \\\"Bob\\\" Abney was born in July 1915.\\n\\nThe January 1920 census reportedly lists her as Chessie Abney, widow, head of household, with son Robert L., about 4. The original image still needs to be saved and checked.\\n\\nShe married W. M. (William Monroe) Baker on 12 Aug 1920, still using the name Abney (Rockcastle marriage index, Book 30, p. 114). Later she married a Mr. Thomas, giving the name sequence Abney, Baker, Thomas.\\n\\nHer obituary reportedly names her sons as Robert Abney of Covington, Monroe Baker and Raymond Baker.\" });\n    hw('johnAAnglin', 'John A. Anglin', 'm', { branch: 'abney', status: 'family', sources: [CHO], tagline: \"Chessie's father, as reported in her obituary and family material.\" });\n    hw('maryAnglin', 'Mary Anglin', 'f', { branch: 'abney', status: 'family', sources: [CHO], tagline: \"Chessie's mother, as reported in her o ames Logan as his brother, so together they identify Robert\\'s parents.', ['logan', 'johnWR', 'sidneyA', 'bobRenner'], 'Screenshot from Jon. File: image(20261002-174139).png'),\n      rec('Renner records', WALT.url, 'Death certificate: Walter Renner, 1918', 'Kentucky certificate of death, Rockcastle County. Walter Renner, single, born 10 Dec 1906, died 29 Apr 1918, age 11, of pneumonia; hookworm given as a contributing cause. Father: Robert Renner. Mother: Lillie Suttles. Both born in Kentucky. Informant: Robert Renner, Livingston. Buried near Livingston, 30 Apr 1918.', 'Direct original record. Supports the Robert and Lillie Suttles family. It doesn\\'t by itself prove this Robert is Robert Lee.', ['walter', 'bobRenner', 'lila'], 'Screenshot from Jon. File: image(20261002-174249).png'),\n      rec('Renner records', C1850.url, '1850 census: Adam and Jacob Renner, next-door households', 'Rockcastle County, Southern District, enumerated 2 Sep 1850. Household 169: Adam Renner, 54, farmer, born in Virginia, with Margaret, Elizabeth, Jemima and Henry. Household 170 (highlighted): Jacob Renner, 59, farmer, real estate $800, born in Virginia, with Abigail, 47, and younger Renners Smith, Levi, Ann, Willis, Martha, William, Elisha and Alexander. Household 171: Vincent Renner, 30, with Charlotte and Semantha.', 'Direct original census. Living side by side fits Adam and Jacob being brothers, but the 1850 census names no relationships. Westerfield had his own household by then.', ['jacobJr', 'abigail', 'adamR1796'], 'Screenshot from Jon. File: image(20261002-192715).png'),\n      rec('Renner records', C1820.url, '1820 census: Jacob Rener, Rockcastle County', 'Page 251. \"John Renner\" and \"Jacob Rener\" appear near the bottom. According to the index, Jacob\\'s household included a man aged 26–44 and a boy under 10. That fits Jacob Jr., about 29, and Westerfield, about 4.', 'Direct original census, but only heads of household are named. It fits Westerfield being Jacob Jr.\\'s s nner, daughter of Robert Lee Renner and Lida Suttles.', JRA.label], ['conflict', 'Jeff Renner\\'s report says she married \"Eddie Stallsworth.\" Rejected: Jon confirms her husband was Teddy, and Eddie was her son.', JRA.label]] });\n    upd('ted', { name: 'Teddy Stallsworth', status: 'family', sources: [HW, FRO, JRA], tagline: \"Fannie Renner's husband. Judy's father.\",\n      notes: \"Jon confirms that Fannie's husband was Teddy Stallsworth. Their son was Charles \\\"Eddie\\\" Stallsworth.\\n\\nJeff Renner's 2005 report gives Fannie's spouse as \\\"Eddie Stallsworth, b. abt. 1909.\\\" That's a known error: Eddie was her son. An earlier summary of Frank Stallsworth's obituary also gave the father's name as Eddie, so the original should be checked again.\\n\\nTeddy is not Wendell's father. Wendell's father was Bob Abney. Teddy's first wife is listed as Flossie Hood.\",\n      ev: [['oral', 'Jon: Teddy was Fannie\\'s husband; Eddie was her son.', 'Family testimony'], ['conflict', 'Jeff Renner\\'s report names \"Eddie Stallsworth\" as Fannie\\'s spouse. Rejected.', JRA.label]] });\n    upd('charlesS', { name: 'Charles \"Eddie\" Stallsworth', tagline: \"Fannie's son, not her husband.\", notes: \"Jeff Renner's report wrongly lists an Eddie Stallsworth as Fannie's husband. Jon confirms Eddie was her son.\" });\n    upd('frankS', { notes: \"His obituary, as summarised earlier, gives his parents as \\\"Eddie and Fannie Renner Stallsworth\\\" and names Judy Mullins as his sister. Jon confirms Fannie's husband was Teddy, so the father's name in that summary should be checked against the original obituary.\" });\n    upd('judy', { notes: people.judy.notes.replace('Eddie \"Teddy\" Stallsworth', 'Teddy Stallsworth') });\n    upd('wendell', { notes: people.wendell.notes.replace('with Eddie Stallsworth', 'with Teddy Stallsworth') + \"\\n\\nHis biological father was Bob Abney. His obituary says so, family testimony agrees, and Jon reports that his own AncestryDNA results confirm it.\",\n      ev: [['direct', 'His 2011 obituary says he was born to Fannie Renner and Robert Abney.', S.wendell.label], ['dna', 'Jon reports that his AncestryDNA results confirm Bob Abney as his biological grandfather.', DNAJ.label], ['conflict', 'The handwritten notes list him (\"Tolly\") among Fannie\\'s Stallsworth children. That reflects the household he belonged to, not his father.', HW.label]] });\n    upd('edith', { rel: \"Your great-aunt: Bob Abney's wife, not your biological grandmother\" });\n    upd('bobAbney', { sources: [S.wendell, FSJ, FSB, PL, DNAJ], notes: people.bobAbney.notes + \"\\n\\nJon reports that his own AncestryDNA results confirm Bob as his biological grandfather. The detailed match data hasn't been reviewed for this site. This conclusion rests on family testimony together with Jon's DNA results.\",\n      ev: [['direct', \"Wendell's 2011 obituary names Robert Abney as his father.\", S.wendell.label], ['dna', 'Jon reports that his AncestryDNA results confirm Bob as his biological grandfather.', DNAJ.label], ['compiled', 'FamilySearch attaches him as son of Wesley Abney Jr. and Chessie Anglin. Born 18 Jul 1915, died 21 Aug 1983.', FSJ.label], ['hyp', \"No record yet names Bob's father directly. His birth record or original SS-5 is needed.\", ''], ['conflict', 'PeopleLegacy gives his wife as \"Mildred Irene Renner Abney.\" Rejected: that mixes his wife Edith with his daughter Mildred Irene.', PL.label]] });\n\n    upd('bobRenner', { name: 'Robert Lee \"Bob\" Renner', born: '14 Feb 1870', died: '30 Oct 1947', dateNote: 'Birth: 14 Feb 1870 (gravestone) · 14 Feb 1871 (1947 obituary). Death 30 Oct 1947 in both.', place: 'Rockcastle County, KY; buried Pine Hill', parents: ['johnWR', 'sidneyA'], status: 'record', sources: [STONE, OBIT, FAG, WALT, LOGAN, JRA, HW], photos: [recBy('Gravestone: Bob Renner'), recBy('Obituary: Robert Renner')],\n      tagline: \"Fannie's father; Jon's great-grandfather. Father of thirteen. Not the same man as Robert Lewis \\\"Bob\\\" Abney.\",\n      notes: \"His gravestone reads \\\"Bob Renner, Feb. 14, 1870 – Oct. 30, 1947.\\\" The obituary has the same death date but gives his birth year as 1871. The stone's date is used here, and the obituary's is noted.\\n\\nThe 1947 obituary says he married Lile Southards (Suttles) and that 13 children were born, 8 of them still living. The seven daughters were Mrs. Bob Abner [Edith] of Covington, Mrs. Irvin Etler [Rose] of Florence, Mrs. Fred Tobergte [Myrtle] of Erlanger, Mrs. John Owens [Maude] of Livingston, Mrs. Burges Ramsey [Lula] of Well Hope, Mrs. Albert Mink [Minnie] of Pine Hill, and Miss Fanny Renner of Pine Hill. The son was Elmer Renner of Florence. It also names his brothers Logan Renner and J. A. Renner and his sisters Alice Mason and Mary Branson. The funeral was at the Fundamental Missionary Baptist Church, Pine Hill, with burial in Pine Hill cemetery.\\n\\nHis parents were John W. Renner and Sidney Arnold. His brother Logan's original death certificate names them, and the obituary confirms Logan as his brother. The handwritten family notes name Westerfield Renner and Miranda Mize instead, but they were his grandparents.\\n\\nDon't confuse him with Robert Lewis \\\"Bob\\\" Abney (1915–1983), Jon's grandfather and the husband of Robert's daughter Edith.\",\n      ev: [['direct', 'Gravestone: 14 Feb 1870 – 30 Oct 1947.', STONE.label], ['direct', '1947 obituary: wife Lile Southards, 13 children, brothers Logan and J. A., sisters Alice Mason and Mary Branson. Birth given as 1871.', OBIT.label], ['direct', \"Son Walter's 1918 death certificate names his parents as Robert Renner and Lillie Suttles.\", WALT.label], ['direct', \"Brother Logan's 1959 death certificate names their parents as John Renner and Sydney Arnold.\", LOGAN.label], ['compiled', 'Son of John W. Renner and Sidney Arnold; married Lida Suttles about 1901.', JRA.label], ['conflict', 'The handwritten notes give his parents as Westerfield Renner and Miranda Mize. Superseded: they were his grandparents.', HW.label]] });\n    upd('lila', { name: 'Lida / Lila (Suttles) Renner', born: 'c. 1881', died: '28 Feb 1923', dateNote: 'Birth: about 1881 (Jeff Renner) · about 1884 (handwritten notes, uncertain). Death 28 Feb 1923 per Jeff Renner. No death record seen.', status: 'conflict', sources: [OBIT, WALT, JRA, HW],\n      tagline: \"Robert Lee Renner's wife; mother of the thirteen Renner children. Jon's great-grandmother.\",\n      notes: \"Her name is written several ways: \\\"Lile Southards\\\" in her husband's 1947 obituary, \\\"Lillie Suttles\\\" on son Walter's 1918 death certificate, \\\"Lida Suttles\\\" in Jeff Renner's report, and Charlotte \\\"Lila\\\" or \\\"Lina\\\" Suttles or Settles in the handwritten family notes. Jeff Renner says she married Robert about 1901 and died on 28 Feb 1923, three days after the twins Fannie and Brunner were born. Her original death record would settle both her name and the date. Her cause of death isn't known.\" });\n    upd('walter', { born: '10 Dec 1906', died: '29 Apr 1918', status: 'record', sources: [WALT, JRA, HW], photos: [recBy('Death certificate: Walter Renner')], tagline: 'Died at 11 of pneumonia.', notes: 'His original death certificate: Walter Renner, single, born 10 Dec 1906, died 29 Apr 1918 of pneumonia, with hookworm as a contributing cause. Father Robert Renner, mother Lillie Suttles, both born in Kentucky. The informant was Robert Renner of Livingston. Buried near Livingston on 30 Apr 1918.' });\n    upd('lula', { name: 'Lula Mae (Renner) Ramsey', born: 'c. 1904', sources: [HW, JRA, OBIT] });\n    upd('maude', { name: 'Maudie Alice \"Maude\" (Renner) Owens', born: 'c. 1905', sources: [HW, JRA, OBIT] });\n    upd('minnie', { born: 'c. 1910', sources: [HW, JRA, OBIT], notes: 'Jeff Renner gives her name as Armelda (Minnie). The handwritten notes say Minnie Armildred.' });\n    upd('marthaR', { born: 'c. 1912', sources: [HW, JRA] });\n    upd('roseR', { name: 'Rose Pearl (Renner) Etler', sources: [HW, JRA, OBIT] });\n    upd('elmerR', { name: 'William Elmer Renner', sources: [HW, JRA, OBIT], notes: 'The only son still living in 1947 (\"Elmer Renner, Florence\").' });\n    upd('myrtle', { name: 'Myrtle Bell (Renner) Toberste', born: '3 Mar 1920', died: '1 Aug 1994', sources: [HW, JRA, OBIT] });\n    upd('virgie', { notes: 'Her father\\'s 1947 obituary calls Lula\\'s husband \"Mrs. Burges Ramsey, Well Hope.\" It\\'s unresolved whether Virgie and Burges are the same man under two names.' });\n    upd('fritz', { notes: 'The 1947 obituary has \"Mrs. Fred Tobergte, Erlanger.\" Fritz is a common nickname for Fred, and Tobergte may be the correct spelling. Not yet confirmed.' });\n    upd('bruner', { born: '25 Feb 1923', dateNote: 'Birth: 25 Feb 1923 (Jeff Renner) · 23 Feb 1923 (handwritten notes). Death 3 Nov 1942 (Navy records).', sources: [NAVY, OBIT, JRA, HW], notes: people.bruner.notes + '\\n\\nHis father\\'s 1947 obituary says \"Burner, twin to Fanny\" was killed in action in the South Pacific. The Navy records place the Hahira in the North Atlantic (Convoy SC-107). The Navy record is the stronger source.' });\n    upd('edith', { born: '10 Jun 1916', sources: [HW, FO, OBIT, JRA], notes: people.edith.notes + '\\n\\nListed as \"Mrs. Bob Abner, Covington\" in her father\\'s 1947 obituary. Jeff Renner gives her full name as Edith Sarah Renner, b. about 1916.' });\n\n    const JW = ['johnWR', 'sidneyA'];\n    upd('logan', { name: 'William Logan Renner', born: '21 Feb 1872', died: '10 Nov 1959', place: 'Rural Pine Hill, Rockcastle Co., KY; buried Pine Hill Cemetery', parents: JW, status: 'record', sources: [LOGAN, OBIT, JRA, HW], photos: [recBy('Death certificate: Logan Renner')], tagline: \"Robert Lee Renner's brother. His death certificate names their parents.\",\n      notes: \"His original death certificate: Logan Renner, widowed farmer, born 21 Feb 1872 in Rockcastle County, died 10 Nov 1959 at age 87 of lobar pneumonia following influenza. Father John Renner, mother Sydney Arnold. The informant was Lula England. Buried at Pine Hill Cemetery on 11 Nov 1959.\\n\\nRobert Lee Renner's 1947 obituary names \\\"Logan Renner, Pine Hill\\\" as his brother. The handwritten notes give his wife as Liza Stallsworth.\" });\n    upd('emaline', { name: 'Sarah Emeline \"Emaline\" (Renner) Cotton', born: '1868', died: 'after 1930', parents: JW, status: 'compiled', sources: [JRA, HW], tagline: 'Sister of Robert Lee Renner.', notes: 'Jeff Renner: Sarah Emeline Renner, b. 1868, married William Cotton about 1902. The handwritten notes list her as Emaline (Renner) Cotton.' });\n    upd('oMartha', { name: 'Martha B. Renner', born: '1868', died: '29 Mar 1947', parents: JW, status: 'compiled', sources: [JRA, HW] });\n    upd('maryL', { name: 'Mary Elizabeth \"Mary L.\" (Renner) Branson', born: '1877', parents: JW, status: 'compiled', sources: [JRA, OBIT, HW], notes: 'Jeff Renner: Mary Elizabeth Renner, b. 1877. Robert\\'s 1947 obituary names a sister \"Mrs. Mary Branson, Middlesborough.\" The surname is hard to read in the clipping. The handwritten notes say \"Mary L.\"' });\n    upd('andrew', { name: 'John Andrew \"J. A.\" Renner', born: '26 Mar 1882', died: '9 Mar 1965', place: 'Died Middlesboro, KY', parents: JW, status: 'compiled', sources: [JRA, OBIT, HW], notes: 'Jeff Renner: John Andrew Renner, 1882–1965. Robert\\'s 1947 obituary names a brother \"Mr. J. A. Renner, Lake City, Tenn.\" The handwritten notes list \"Andrew.\"' });\n    add('alice', { name: 'Alice (Renner) Mason', sex: 'f', born: 'Jun 1884', died: 'after 1937', parents: JW, status: 'compiled', sources: [JRA, OBIT], tagline: 'Sister of Robert Lee Renner.', notes: 'Robert\\'s 1947 obituary names \"Mrs. Alice Mason, Livingston\" as his sister.' });\n    add('lulie', { name: 'Lulie Renner', sex: 'f', born: '1888', died: '1893', parents: JW, status: 'compiled', sources: [JRA], tagline: 'Sister of Robert Lee Renner; died as a child.' });\n    const hwSib = \"The handwritten notes list a John and a Sidney among Robert's brothers and sisters. Robert's parents were named John and Sidney, so the notes may have put the parents' names in the sibling list. Or they may be real siblings that Jeff Renner's report missed. Sidney's two wives suggest he was a real person. Left unlinked until a record settles it.\";\n    upd('oJohn', { parents: [null, null], status: 'research', tagline: 'Listed with Robert Lee Renner\\'s siblings in the handwritten notes. Not yet placed.', notes: hwSib });\n    upd('sidney', { parents: [null, null], status: 'research', tagline: 'Listed with Robert Lee Renner\\'s siblings in the handwritten notes. Not yet placed.', notes: hwSib });\n    upd('sarahE', { parents: ['westerfield', 'miranda'], status: 'compiled', sources: [JRA, HW], tagline: \"Probably Robert's aunt: daughter of Westerfield and Maranda, per Jeff Renner.\", notes: 'The handwritten notes include a Sarah Elizabeth Renner (c. 1868) among Robert\\'s siblings. Jeff Renner lists a Sarah Elizabeth, b. about 1868, as the youngest child of Westerfield and Maranda. That would make her Robert\\'s aunt, though close to him in age. Robert\\'s sister Sarah Emeline was also born in 1868, so the two may have been mixed up.' });\n\n    add('johnWR', { name: 'John Westerfield \"John W.\" Renner', sex: 'm', born: 'Aug 1846', died: 'Disputed', dateNote: 'Death: about 1925 (Jeff Renner estimate) · 5 Nov 1958 (Geneanet tree, which would make him about 112, so implausible). No death record found.', place: 'Rockcastle County, KY', status: 'record', parents: ['westerfield', 'miranda'], sources: [LOGAN, OBIT, JRA, GJW],\n      tagline: \"Robert Lee Renner's father; Jon's 2nd great-grandfather.\",\n      notes: \"Born about August 1846 in Rockcastle County, son of Westerfield Renner and Maranda Mize. Married Sidney Arnold about 1867. According to Jeff Renner he married a second time, to an Armilda, about 1919.\\n\\nHis son Logan's original death certificate names Logan's parents as John Renner and Sydney Arnold. Robert Lee Renner's obituary names Logan as Robert's brother. Together, these original records identify John W. and Sidney as Robert's parents.\\n\\nHis children, according to Jeff Renner: Sarah Emeline, Martha B., Robert Lee, William Logan, Mary Elizabeth, John Andrew, Alice and Lulie.\\n\\nWhen he died is unresolved. Jeff Renner estimates about 1925. A Geneanet tree gives 5 Nov 1958, which would make him about 112. Neither has been confirmed.\",\n      ev: [['direct', \"Logan's 1959 death certificate names his father as John Renner and his mother as Sydney Arnold.\", LOGAN.label], ['direct', \"Robert Lee Renner's 1947 obituary names Logan as Robert's brother.\", OBIT.label], ['compiled', 'Born Aug 1846; son of Westerfield and Maranda; married Sidney Arnold about 1867; died about 1925.', JRA.label], ['compiled', 'Same family. Death given as 5 Nov 1958.', GJW.label], ['conflict', 'Death about 1925 vs. 5 Nov 1958. Neither verified; 1958 is implausible.', '']] });\n    add('sidneyA', { name: 'Sidney / Sydney (Arnold) Renner', sex: 'f', born: '28 Sep 1849', died: '2 Feb 1918', place: 'Born Pulaski Co., KY; died Rockcastle Co., KY', branch: 'arnold', status: 'compiled', parents: ['andrewA', 'cynthia'], sources: [LOGAN, JARN, JRA],\n      tagline: \"John W. Renner's wife; Robert Lee's mother. Jon's 2nd great-grandmother.\",\n      notes: \"Named as \\\"Sydney Arnold\\\" on her son Logan's 1959 death certificate. Her dates and parents (Andrew Jackson Arnold and Cynthia Storm) come from Jeff Renner's compiled Arnold research.\",\n      ev: [['direct', \"Logan's 1959 death certificate gives his mother's maiden name as Sydney Arnold.\", LOGAN.label], ['compiled', 'Born 28 Sep 1849, Pulaski Co.; died 2 Feb 1918, Rockcastle Co.; daughter of Andrew Jackson Arnold and Cynthia Storm.', JARN.label]] });\n    upd('westerfield', { name: 'Westley Westerfield Renner', born: 'c. 1816', died: 'after 1880', dateNote: 'Death: 1880 (Geneanet) · after 1880 (Jeff Renner). Marriage: 21 Jul 1839 (Jeff Renner, Geneanet) · 21 Aug 1839 (Isaac Mize\\'s consent, as reported). The original register is needed.', place: 'Rockcastle County, KY', parents: ['jacobJr', null], hypParents: 'probable', status: 'compiled', sources: [JRA, JJR, GWW, C1820, HW],\n      tagline: \"John W.'s father; Jon's 3rd great-grandfather. Probably Jacob Jr.'s eldest son.\",\n      notes: \"Born about 1816 in Rockcastle County. Married Maranda (Miranda) Mize in Pulaski County in 1839. The day is disputed: 21 July in Jeff Renner's report, 21 August in the reported consent from her father, Isaac Mize.\\n\\nHis father was probably Jacob Renner Jr. Jeff Renner calls Westerfield Jacob Jr.'s probable eldest son, by a first wife whose name is unknown, and says this can't be proven conclusively. The 1820 and 1830 census households of Jacob Jr. each include a boy of the right age, but early censuses don't name children. Some other genealogies make Westerfield a son of Jacob Sr. instead.\\n\\nHis children, according to Jeff Renner: Martha, William A., John W., James G., Mary C., Milton F., Henry T., Harvey Green, Frank W. and Sarah Elizabeth.\\n\\nIn 1878 a Rockcastle court excused a Westerfield Renner from the county poll tax. That order doesn't name his parents.\",\n      ev: [['compiled', \"Jeff Renner: probably Jacob Jr.'s eldest son, by an unknown first wife. Not conclusively proven.\", JJR.label], ['direct', 'The 1820 census shows a boy under 10 in Jacob Rener\\'s household. That fits, but no name is given.', C1820.label], ['hyp', 'The 1830 census household has a boy aged 10–14, consistent with Westerfield at about 14. Image not in this upload.', ''], ['compiled', 'Geneanet names Jacob Jr. as his father. This is a member tree, not proof.', GWW.label], ['conflict', 'Other published genealogies make him a son of Jacob Sr. Not followed here.', ''], ['conflict', 'The handwritten notes call him Robert Lee\\'s father. Superseded: he was Robert\\'s grandfather.', HW.label]] });\n    upd('miranda', { name: 'Maranda / Miranda J. (Mize) Renner', born: 'c. 1825', died: 'after 1880', place: 'Born Pulaski Co., KY', branch: 'arnold', parents: ['isaacMize', 'pollyLester'], status: 'compiled', sources: [JRA, JMIZE, GWW, HW],\n      tagline: \"Westerfield's wife; John W.'s mother. Jon's 3rd great-grandmother.\", notes: 'Daughter of Isaac Mize and Polly Lester, according to Jeff Renner, who cites Isaac\\'s original letter of consent for her marriage. Married Westerfield Renner in 1839. The day (21 July or 21 August) is unresolved.\\n\\nHarvey Green Renner\\'s original death certificate seems to name his mother as \"Martha Owens,\" not Maranda Mize. That record hasn\\'t been reconciled.' });\n    const WM = ['westerfield', 'miranda'];\n    [['williamA', 'William A. Renner', 'm', '4 Mar 1840', '20 Feb 1917'], ['marthaW', 'Martha Renner', 'f', '17 Apr 1840', '4 May 1924'], ['jamesG', 'James G. Renner', 'm', 'c. 1849', ''], ['maryC', 'Mary C. Renner', 'f', 'c. 1851', '1920–1930'], ['milton', 'Milton F. Renner', 'm', 'Jul 1852', 'after 1936'], ['henryT', 'Henry T. Renner', 'm', 'c. 1856', 'before 1920'], ['frankW', 'Frank W. Renner', 'm', 'c. 1865', '']]\n      .forEach(([id, name, sex, born, died]) => add(id, { name, sex, born, died, parents: WM, status: 'compiled', sources: [JRA], tagline: (sex === 'f' ? 'Daughter' : 'Son') + ' of Westerfield and Maranda; ' + (sex === 'f' ? 'sister' : 'brother') + ' of John W.' }));\n    people.williamA.notes = people.marthaW.notes = 'Jeff Renner gives Martha 17 Apr 1840 and William A. 4 Mar 1840. Two births six weeks apart is impossible, so one date is wrong.';\n    people.marthaW.place = 'Died Sullivan Co., MO';\n    add('harvey', { name: 'Harvey Green Renner', sex: 'm', born: '23 Jun 1858', died: '21 Mar 1938', parents: WM, status: 'conflict', sources: [JRA], tagline: 'Son of Westerfield, per Jeff Renner. His death certificate names a different mother.', notes: 'His original death certificate names his father as Westerfield, but his mother apparently as \"Martha Owens,\" not Maranda Mize. Some dates also differ between sources. He\\'s kept here as Jeff Renner places him, flagged until the certificate is compared in full. (The certificate image wasn\\'t in this upload.)' });\n    add('jacobJr', { name: 'Jacob Renner Jr.', sex: 'm', born: 'c. 1791, Virginia', died: 'after 1870 (c. 1870–74)', place: 'Long Branch & Skeggs Creek, Rockcastle Co., KY', status: 'compiled', parents: ['jacobSr', 'maryJS'], sources: [C1850, C1820, JJR, JRA, JTAX, GJ], photos: [recBy('1850 census'), recBy('1820 census')],\n      tagline: \"Probably Westerfield's father; Jon's 4th great-grandfather if so.\",\n      notes: \"Born about 1791 in Virginia. He was 59 in the original 1850 census and 79 in the 1870 index, living near Long Branch and Skeggs Creek in Rockcastle County. Jeff Renner estimates he died between 1870 and 1874.\\n\\nJeff Renner's biography makes an important new point: Jacob Jr. had at least 17 children by two wives. His first wife's name is unknown. She died around 1820–22 and had at least three children, Westerfield probably the eldest son. Family tradition says two early Renner brothers married two sisters from North Carolina. His brother John married Martha Linville, so the first wife may have been a Linville too. Unproven.\\n\\nHis second wife was Abigail Parsons, born about 1803, with at least 14 children from about 1822. Online trees give an 1824 marriage date, but that can't be relied on. Abigail is not shown as Westerfield's mother.\\n\\nLand: a John Baker grant of 1825 describes a spring \\\"where Jacob Renner now lives.\\\" Jacob Jr. received 100 acres on Skeggs Creek in 1847 and 150 acres on Long Branch in 1864. No gravestone is known for him or for Abigail.\",\n      ev: [['direct', '1850 census: Jacob Renner, 59, farmer, born Virginia, with Abigail, 47. Next door to Adam Renner, 54.', C1850.label], ['direct', '1820 census: Jacob Rener household with a man 26–44 and a boy under 10.', C1820.label], ['compiled', 'Two wives; first wife unknown; Westerfield probably his eldest son.', JJR.label], ['hyp', 'The first wife may have been a Linville, based on a family tradition of two brothers marrying two North Carolina sisters.', JJR.label], ['compiled', 'The 1870 index shows him at 79, with a Charity in the household. The original 1870 image isn\\'t in this upload.', 'Ancestry 1870 index screenshot']] });\n    add('abigail', { name: 'Abigail (Parsons) Renner', sex: 'f', born: 'c. 1803, Virginia', died: 'before 1870', dateNote: 'Death: 1850–1860 (Jeff Renner report) · before 1870 (Jeff Renner biography). Marriage \"c. 1824\" (Geneanet) is not proven.', status: 'compiled', sources: [C1850, JJR, JRA], tagline: \"Jacob Jr.'s second wife. Not Westerfield's mother.\", notes: 'Age 47 in the 1850 census. Jeff Renner gives her at least 14 children, possibly from 1822, including Vincent, John, William Smith, Levi, Ermina Jane, Ann B., Martha, Wilson E., Elisha, Campbell Alexander, Willis G. and Green B. Westerfield, born about 1816, belongs to the first marriage.' });\n    add('jacobSr', { name: 'Jacob Renner Sr.', sex: 'm', born: 'c. 1765–66, Virginia', died: 'c. 1832, Rockcastle Co.', place: 'Southwest Virginia; Rockcastle Co., KY, from about 1806', status: 'compiled', parents: ['adamSr', null], hypParents: 'probable', sources: [JSR, JRA, JTAX, GJ, LVA, ANC], photos: [recBy('Map: early land grants'), recBy('Map: Line Creek')],\n      tagline: \"Jacob Jr.'s father; probably Jon's 5th great-grandfather. Probably Adam Runner Sr.'s son.\",\n      notes: \"Born about 1765–66 in Virginia. He moved from southwest Virginia to Kentucky around 1806 and held land on Line Creek and Buffalo Branch in Rockcastle County. He died about 1832; his grave is unknown. He married Mary, whose maiden name is unknown.\\n\\nChildren, according to Jeff Renner: John (c. 1785–90), Louisa (c. 1790), Jacob Jr. (c. 1791), Sylvester (c. 1793), Adam (c. 1796), Elisha (c. 1801) and several daughters.\\n\\nHis father was probably Adam Runner Sr. of Wythe County, Virginia. Jeff Renner calls the circumstantial evidence strong but not conclusive.\\n\\nAncestry suggests Jacob as Jon's potential 5th great-grandfather, with \\\"154 matches.\\\" Those are tree-based groupings, not 154 independently proven genetic lines.\",\n      ev: [['compiled', \"Jeff Renner: wife Mary; children including Jacob Jr.; moved to Kentucky about 1806.\", JSR.label], ['hyp', 'Son of Adam Runner Sr. Strong circumstantial case plus an old Y-DNA match, but no record directly names this Jacob as Adam\\'s son.', JRA.label], ['dna', 'Ancestry ThruLines suggests him as a potential ancestor with 154 matches. That figure is tree-based, not proof.', ANC.label]] });\n    add('maryJS', { name: 'Mary (\"Maray\") Renner', sex: 'f', born: 'c. 1771–75', died: 'after 1830', status: 'research', sources: [JSR, GJ], tagline: \"Jacob Sr.'s wife. Maiden name unknown.\", notes: 'Her daughter Louisa\\'s 1809 marriage record names the parents as \"Jacob and Maray Runner.\" Many online trees call her Mary Ott, but Jeff Renner says that is only a possibility. No record gives her maiden name.', ev: [['compiled', 'Named \"Maray\" in daughter Louisa\\'s 1809 marriage record.', JSR.label], ['conflict', 'Geneanet and other trees give \"Mary Ott.\" Treated as a guess.', GJ.label]] });\n    const JS = ['jacobSr', 'maryJS'];\n    [['johnJS', 'John Renner', 'm', 'c. 1785–90', '1847–48', 'Married Martha Linville, the basis of the Linville tradition.'], ['louisaJS', 'Louisa Renner', 'f', 'c. 1790', 'after 1842', 'Her 1809 marriage record names her parents as \"Jacob and Maray Runner.\"'], ['sylvester', 'Sylvester Renner', 'm', 'c. 1793', 'after 1860', ''], ['adamR1796', 'Adam Renner', 'm', 'c. 1794–96', 'Feb 1880', 'Next door to Jacob Jr. in the 1850 census, age 54.'], ['elishaJS', 'Elisha Renner', 'm', 'c. 1801', '1866–67', '']]\n      .forEach(([id, name, sex, born, died, n]) => add(id, { nam or SS-5 naming Bob's father would complete the proof.\"],\n      ['New original Renner records', \"Bob Renner's gravestone (1870–1947) and his 1947 obituary, which gives 1871. Logan Renner's 1959 death certificate, naming his parents as John Renner and Sydney Arnold. Walter Renner's 1918 death certificate, naming his parents as Robert Renner and Lillie Suttles. The 1820 and 1850 Rockcastle censuses for Jacob Renner Jr. Together they correct the family's parents: Robert's parents were John W. and Sidney, not Westerfield and Miranda, who were his grandparents.\"],\n      ['The Renner line, five generations back', \"Robert Lee → John W. Renner (b. 1846) → Westerfield (c. 1816) → probably Jacob Jr. (c. 1791) → Jacob Sr. (c. 1766) → probably Adam Runner Sr. (c. 1731, Wythe County, Virginia). The first two links rest on original records. The rest rests on Jeff Renner's compiled research, census age patterns and land records. Links marked \\\"probably\\\" aren't proven.\"],\n      [\"Jeff Renner's insight on Jacob Jr.'s first wife\", \"Jacob Jr. had at least 17 children by two wives. Westerfield was probably the eldest son of the first wife, whose name is unknown. Family tradition about two brothers marrying two North Carolina sisters points to a possible Linville. Abigail Parsons was the second wife, so she is not shown as Westerfield's mother.\"],\n      ['What DNA can and can\\'t say', \"In the old Runner/Renner Y-DNA project, a Jacob Renner male-line descendant matched an Adam Runner Jr. descendant on 24 of 25 markers. That supports a shared paternal line, but it doesn't name Adam Sr.'s parents. Ancestry's \\\"154 matches\\\" for Jacob Sr. comes from family trees, not 154 proven genetic lines. Jon's ethnicity estimate can't confirm a specific 1700s ancestor.\"],\n      ['The German question: still open', \"At Jon's request, the proposed German line is shown: Gottlieb Lauffer \\\"Raemer\\\" Runner and Anna Catherine Kohl, back to Sebastian Lauffer (1646–1712). It comes
