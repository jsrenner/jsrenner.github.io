document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rap; font-size:13px; color:#6e645a\">{{ homePhotos }} photos<span style=\"font-size:18px; color:#8a3324\">→<\u002Fspan><\u002Fspan>\n                <\u002Fbutton>\n                <button sc-camel-on-click=\"{{ goRecords }}\" style=\"display:grid; grid-template-columns:{{ homeRowCols }}; gap:4px {{ homeRowGap }}; align-items:center; padding:20px 4px; background:none; border:none; border-bottom:1px solid #d8cdbb; font:inherit; color:#2a2521; text-align:left; cursor:pointer\" style-hover=\"background:#efe7d8\">\n                  <img src=\"{{ hi_records_Lewis_R_Bond_gravestone_jpg }}\" alt=\"\" style=\"width:{{ homeImg }}; height:{{ homeImg }}; object-fit:cover; object-position:center 40%; border-radius:3px; background:#2a2521\">\n                  <span style=\"display:flex; flex-direction:column; gap:5px; min-width:0\"><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:clamp(22px,2.6vw,28px); line-height:1.1\">Records &amp; documents<\u002Fspan><span style=\"font-size:14px; line-height:1.5; color:#5e554c; text-wrap:pretty\">Obituaries, certificates, census pages and gravestones.<\u002Fspan><\u002Fspan>\n                  <span style=\"display:{{ homeMetaDisplay }}; align-items:baseline; gap:10px; white-space:nowrap; font-size:13px; color:#6e645a\">{{ homeRecords }} records<span style=\"font-size:18px; color:#8a3324\">→<\u002Fspan><\u002Fspan>\n                <\u002Fbutton>\n                <button sc-camel-on-click=\"{{ goResearch }}\" style=\"display:grid; grid-template-columns:{{ homeRowCols }}; gap:4px {{ homeRowGap }}; align-items:center; padding:20px 4px; background:none; border:none; border-bottom:1px solid #d8cdbb; font:inherit; color:#2a2521; text-align:left; cursor:pointer\" style-hover=\"background:#efe7d8\">\n                  <img src=\"{{ hi_photos_john_westerfield_renner_restored_bw_jpg }}\" alt=\"\" style=\"width:{{ homeImg }}; height:{{ homeImg }}; object-fit:cover; object-position:center 20%; border-radius:3px; background:#2a2  grid-template-columns:{{ homeRowCols }}; gap:4px {{ homeRowGap }}; align-items:center; padding:20px 4px; background:none; border:none; border-bottom:1px solid #d8cdbb; font:inherit; color:#2a2521; text-align:left; cursor:pointer\" style-hover=\"background:#efe7d8\">\n                  <img src=\"{{ hi_photos_virginia_with_bob_edith_abney_jpg }}\" alt=\"\" style=\"width:{{ homeImg }}; height:{{ homeImg }}; object-fit:cover; object-position:center 30%; border-radius:3px; background:#2a2521\">\n                  <span style=\"display:flex; flex-direction:column; gap:5px; min-width:0\"><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:clamp(22px,2.6vw,28px); line-height:1.1\">People<\u002Fspan><span style=\"font-size:14px; line-height:1.5; color:#5e554c; text-wrap:pretty\">Everyone in the record, with dates, stories, sources and photos.<\u002Fspan><\u002Fspan>\n                  <span style=\"display:{{ homeMetaDisplay }}; align-items:baseline; gap:10px; white-space:nowrap; font-size:13px; color:#6e645a\">{{ homePeople }} people<span style=\"font-size:18px; color:#8a3324\">→<\u002Fspan><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:1 1 320px; min-width:0; max-width:100%; display:flex; flex-direction:column; gap:14px\">\n<div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; min-height:20px\">\n                <h2 style=\"margin:0; font-size:12px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase; color:#8a3324\">What's new<\u002Fh2>\n                <span style=\"font-size:13px; color:#6e645a\">{{ newsCount }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; border-top:2px solid #2a2521\">\n                <sc-for list=\"{{ newsGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex; flex-direction:column\">\n                    <div style=\"padding:14px 0 6px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#8a3324\">{{ g.date }}<\u002Fdiv>\n                    <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                      <button sc-camel-on-click=\"{{ it.onClick }}\" style=\"display:flex; gap:12px; align-items:flex-start; padding:10px 0; background:none; border:none; border-bottom:1px solid #d8cdbb; text-align:left; font:inherit; color:#2a2521; cursor:pointer\" style-hover=\"background:#efe7d8\">\n                        <sc-if value=\"{{ it.hasThumb }}\"><img src=\"{{ it.thumb }}\" alt=\"\" style=\"flex:none; width:56px; height:56px; object-fit:cover; border-radius:2px; background:#2a2521\"><\u002Fsc-if>\n                        <span style=\"display:flex; flex-direction:column; gap:3px; min-width:0\">\n                          <span style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px\"><span style=\"font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">{{ it.kind }}<\u002Fspan><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:16px; line-height:1.3\">{{ it.title }}<\u002Fspan><\u002Fspan>\n                          <span style=\"font-size:13px; line-height:1.5; color:#5e554c; text-wrap:pretty\">{{ it.text }}<\u002Fspan>\n                        <\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNotables }}\">\n        <div style=\"display:flex; flex-direction:column; gap:24px\">\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 16px\">\n              <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Notable ancestors<\u002Fh2>\n              <span style=\"font-size:13px; color:#6e645a\">{{ notableCount }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:2px solid #2a2521; max-width:820px\">\n              <p style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-size:clamp(20px,2.4vw,26px); line-height:1.3; text-wrap:pretty\">Through the Abney line, the family's pedigree reaches back to medieval kings, queens and lords of England, Scotland, Wales and France.<\u002Fp>\n              <p style=\"margin:0; font-size:14px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Listed from nearest to farthest back. The Abney line is well documented back to Willesley Hall in the 1500s. Further back, the route runs through a published pedigree, and one link (the Berkeley–Mortimer marriage) is disputed by most authorities. Click a name for the full story and evidence.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:10px\">\n              <sc-for list=\"{{ notables }}\" as=\"n\" hint-placeholder-count=\"12\">\n                <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"display:flex; flex-direction:column; gap:5px; padding:14px 16px; background:#fffdf8; border:1px solid #d8cdbb; border-radius:4px; text-align:left; font:inherit; color:#2a2521; cursor:pointer\" style-hover=\"background:#efe7d8; border-color:#bfb39f\">\n                  <span style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#5b4a7a\">{{ n.title }}<\u002Fspan>\n                  <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:18px; line-height:1.25\">{{ n.name }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:#6e645a\">{{ n.dates }}<\u002Fspan>\n                  <span style=\"font-size:13px; line-height:1.5; color:#4a423b; text-wrap:pretty\">{{ n.tagline }}<\u002Fspan>\n                  <span style=\"margin-top:2px; font-size:12px; color:#8a3324\">{{ n.rel }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMusic }}\">\n        <div style=\"display:flex; flex-direction:column; gap:28px\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:28px; align-items:flex-end; padding:8px 0 24px; border-bottom:1px solid #d8cdbb\">\n            <div style=\"flex:1 1 440px; min-width:0; display:flex; flex-direction:column; gap:12px; max-width:760px\">\n              <div style=\"font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#8a3324\">A family legacy in Southern Gospel music<\u002Fdiv>\n              <h1 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:clamp(34px,5vw,56px); line-height:1.05\">The Singing Renners<\u002Fh1>\n              <p style=\"margin:0; font-size:17px; line-height:1.6; color:#5e554c; text-wrap:pretty\">For more than two decades, The Singing Renners carried Southern Gospel music from their home in Rockcastle County, Kentucky, to churches, gospel singings, radio audiences and communities across the country. Sometimes billed as The Renner Family or simply The Renners, the group grew from the faith and musical life of Wendell \"Tully\" Renner Sr., his wife Virginia, and their children.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"flex:none; display:flex; gap:28px\">\n              <span style=\"display:flex; flex-direction:column; gap:2px\"><strong style=\"font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:32px; line-height:1\">8<\u002Fstrong><span style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#6e645a\">Albums<\u002Fspan><\u002Fspan>\n              <span style=\"display:flex; flex-direction:column; gap:2px\"><strong style=\"font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:32px; line-height:1\">2<\u002Fstrong><span style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#6e645a\">45s<\u002Fspan><\u002Fspan>\n              <span style=\"display:flex; flex-direction:column; gap:2px\"><strong style=\"font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:32px; line-height:1\">20+<\u002Fstrong><span style=\"font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#6e645a\">Years<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:6px; flex-wrap:wrap\">\n            <sc-for list=\"{{ musicTabs }}\" as=\"m\"><button sc-camel-on-click=\"{{ m.onClick }}\" style=\"padding:9px 16px; border-radius:3px; border:1px solid {{ m.border }}; background:{{ m.bg }}; color:{{ m.color }}; font:inherit; font-size:14px; font-weight:500; cursor:pointer\">{{ m.label }}<\u002Fbutton><\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ musicIsStory }}\">\n            <div style=\"display:flex; flex-direction:column; gap:34px; max-width:740px\">\n              <sc-for list=\"{{ musicStory }}\" as=\"s\">\n                <div style=\"display:flex; flex-direction:column; gap:12px\">\n                  <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:26px; line-height:1.2\">{{ s.h }}<\u002Fh2>\n                  <sc-if value=\"{{ s.hasImg }}\"><button sc-camel-on-click=\"{{ s.onImg }}\" style=\"align-self:flex-start; padding:0; border:1px solid #d8cdbb; border-radius:3px; background:#2a2521; cursor:zoom-in; overflow:hidden; max-width:100%\"><img src=\"{{ s.img }}\" alt=\"{{ s.h }}\" style=\"display:block; max-width:100%; max-height:320px\"><\u002Fbutton><\u002Fsc-if>\n                  <sc-for list=\"{{ s.paras }}\" as=\"p\"><p style=\"margin:0; font-size:16px; line-height:1.7; color:#3e3731; text-wrap:pretty\">{{ p.t }}<\u002Fp><\u002Fsc-for>\n                  <sc-if value=\"{{ s.hasQuote }}\"><p style=\"margin:4px 0; padding-left:18px; border-left:3px solid #8a3324; font-family:'Libre Caslon Text',Georgia,serif; font-style:italic; font-size:22px; line-height:1.4\">{{ s.quote }}<\u002Fp><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ musicIsDisc }}\">\n            <div style=\"display:flex; flex-direction:column; gap:20px\">\n              <sc-for list=\"{{ musicAlbums }}\" as=\"a\">\n                <div style=\"display:flex; flex-wrap:wrap; gap:22px; padding:20px; background:#fbf8f2; border:1px solid #d8cdbb; border-radius:3px\">\n                  <div style=\"flex:0 0 220px; max-width:100%; display:flex; flex-direction:column; gap:12px\">\n                    <div style=\"display:flex; flex-direction:column; gap:5px\">\n                      <button sc-camel-on-click=\"{{ a.onCover }}\" style=\"padding:0; border:1px solid #d8cdbb; border-radius:2px; background:#2a2521; cursor:zoom-in; overflow:hidden\"><img src=\"{{ a.cover }}\" alt=\"{{ a.title }}\" style=\"display:block; width:100%; aspect-ratio:1; object-fit:cover\"><\u002Fbutton>\n                      <span style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">Front<\u002Fspan>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ a.hasBack }}\">\n                      <div style=\"display:flex; flex-direction:column; gap:5px\">\n                        <button sc-camel-on-click=\"{{ a.onBack }}\" style=\"padding:0; border:1px solid #d8cdbb; border-radius:2px; background:#2a2521; cursor:zoom-in; overflow:hidden\"><img src=\"{{ a.back }}\" alt=\"{{ a.backAlt }}\" style=\"display:block; width:100%; aspect-ratio:1; object-fit:cover\"><\u002Fbutton>\n                        <span style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">{{ a.backTag }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"flex:1 1 320px; min-width:0; display:flex; flex-direction:column; gap:10px\">\n                    <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><span style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#8a3324\">{{ a.n }}<\u002Fspan><span style=\"font-size:13px; color:#6e645a\">{{ a.meta }}<\u002Fspan><\u002Fdiv>\n                    <h3 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:24px; line-height:1.2\">{{ a.title }}<\u002Fh3>\n                    <span style=\"font-size:14px; color:#5e554c\">{{ a.artist }}<\u002Fspan>\n                    <sc-if value=\"{{ a.hasNote }}\"><p style=\"margin:0; font-size:14px; line-height:1.6; color:#3e3731; text-wrap:pretty\">{{ a.note }}<\u002Fp><\u002Fsc-if>\n                    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px 24px\">\n                      <sc-for list=\"{{ a.sides }}\" as=\"sd\">\n                        <div style=\"display:flex; flex-direction:column; gap:4px\">\n                          <span style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">{{ sd.label }}<\u002Fspan>\n                          <sc-for list=\"{{ sd.tracks }}\" as=\"t\"><span style=\"font-size:14px; line-height:1.45; color:#2a2521\">{{ t.t }}<\u002Fspan><\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ a.hasCredits }}\"><p style=\"margin:0; padding-top:8px; border-top:1px dotted #cfc4b2; font-size:13px; line-height:1.6; color:#5e554c; text-wrap:pretty\">{{ a.credits }}<\u002Fp><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTree }}\">\n        <div style=\"display:flex; flex-direction:column; gap:20px\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Ancestors of {{ rootName }}<\u002Fh2>\n            <sc-if value=\"{{ rootNotJon }}\">\n              <button sc-camel-on-click=\"{{ backToJon }}\" style=\"background:none; border:none; padding:0; font:inherit; font-size:14px; color:#8a3324; cursor:pointer; text-decoration:underline\">← Back to Jon<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <p style=\"margin:0; font-size:14px; color:#6e645a; line-height:1.5\">Press + to open someone's parents and keep climbing. Click a name to read about them.<\u002Fp>\n          <div style=\"display:flex; gap:16px; font-size:14px\">\n            <button sc-camel-on-click=\"{{ expandAllA }}\" style=\"background:none; border:none; padding:0; font:inherit; color:#8a3324; cursor:pointer; text-decoration:underline\">Expand all<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ collapseA }}\" style=\"background:none; border:none; padding:0; font:inherit; color:#8a3324; cursor:pointer; text-decoration:underline\">Collapse all<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; overflow-x:auto; padding-bottom:8px\">\n            <sc-for list=\"{{ ancRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex; align-items:stretch; min-width:max-content\">\n                <sc-for list=\"{{ r.guides }}\" as=\"g\"><span style=\"flex:none; width:28px; display:flex; justify-content:center\"><span style=\"width:1px; background:#d8cdbb\"><\u002Fspan><\u002Fspan><\u002Fsc-for>\n                <span style=\"flex:none; width:36px; display:flex; align-items:center; justify-content:center\">\n                  <sc-if value=\"{{ r.hasToggle }}\"><button sc-camel-on-click=\"{{ r.onToggle }}\" style=\"width:26px; height:26px; border-radius:50%; border:1px solid #bfb39f; background:#fffdf8; color:#2a2521; font:inherit; font-size:16px; line-height:1; cursor:pointer; padding:0\">{{ r.toggleIcon }}<\u002Fbutton><\u002Fsc-if>\n                  <sc-if value=\"{{ r.noToggle }}\"><span style=\"width:7px; height:7px; border-radius:50%; background:#d8cdbb\"><\u002Fspan><\u002Fsc-if>\n                <\u002Fspan>\n                <sc-if value=\"{{ r.isPerson }}\">\n                  <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"margin:4px 0; display:flex; flex-direction:column; gap:3px; text-align:left; padding:9px 14px; background:{{ r.bg }}; border:1px {{ r.borderStyle }} {{ r.border }}; border-radius:4px; font:inherit; color:#2a2521; cursor:pointer; max-width:560px\">\n                    <span style=\"display:flex; align-items:center; gap:8px\"><span style=\"width:8px; height:8px; border-radius:50%; background:{{ r.branchColor }}; flex:none\"><\u002Fspan><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:16px; line-height:1.3\">{{ r.name }}<\u002Fspan><\u002Fspan>\n                    <span style=\"font-size:13px; color:#6e645a\">{{ r.sub }}<\u002Fspan>\n                    <sc-if value=\"{{ r.hasHint }}\"><span style=\"font-size:12px; color:#8a3324\">{{ r.hint }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ r.isUnknown }}\"><div style=\"margin:4px 0; padding:9px 14px; border:1px dashed #cfc4b2; border-radius:4px; font-size:13px; color:#a0968a; align-self:center\">{{ r.label }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showStatus }}\">\n            <div style=\"display:flex; flex-wrap:wrap; gap:20px; padding-top:16px; border-top:1px solid #d8cdbb; font-size:13px; color:#5e554c\">\n              <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <span style=\"display:flex; align-items:center; gap:8px\"><span style=\"width:10px; height:10px; border-radius:50%; border:2px solid {{ l.color }}\"><\u002Fspan>{{ l.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isDesc }}\">\n        <div style=\"display:flex; flex-direction:column; gap:22px\">\n          <div style=\"display:flex; flex-direction:column; gap:8px\">\n            <sc-if value=\"{{ isAbneyDesc }}\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">The Abney family<\u002Fh2>\n            <p style=\"margin:0; max-width:760px; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Starting with Wesley Abney Sr. and Louisa Ann (Owens) Abney, down through Wesley Jr. and Chessie (Anglin), their son Robert Lewis \"Bob\" Abney, and on to Wendell and his Abney half-brothers and half-sisters. Press + to open a family.<\u002Fp>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isRennerDesc }}\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Robert Lee &amp; Lila Renner's family<\u002Fh2>\n            <p style=\"margin:0; max-width:760px; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Robert Lee \"Bob\" Renner and Lila/Lina Suttles had thirteen children. Through their marriages the Renners joined the Abney, Stallsworth, Mink, Ramsey, Owens, Etler and Toberste families. Click a branch to follow it down.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px\">\n            <sc-for list=\"{{ connections }}\" as=\"c\" hint-placeholder-count=\"0\">\n              <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"display:flex; flex-direction:column; gap:4px; text-align:left; padding:12px 14px; background:#fbf8f2; border:1px solid #d8cdbb; border-top:3px solid {{ c.color }}; border-radius:4px; font:inherit; color:#2a2521; cursor:pointer\">\n                <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:15px; line-height:1.3\">{{ c.child }}<\u002Fspan>\n                <span style=\"font-size:13px; color:#5e554c\">{{ c.spouse }}<\u002Fspan>\n                <span style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:{{ c.color }}\">→ {{ c.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between; padding-top:6px\">\n            <h3 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:22px\">Descendants of {{ descRootName }}<\u002Fh3>\n            <sc-if value=\"{{ descNotDefault }}\">\n              <button sc-camel-on-click=\"{{ backToRenner }}\" style=\"background:none; border:none; padding:0; font:inherit; font-size:14px; color:#8a3324; cursor:pointer; text-decoration:underline\">{{ descBackLabel }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:16px; font-size:14px\">\n            <button sc-camel-on-click=\"{{ expandAllD }}\" style=\"background:none; border:none; padding:0; font:inherit; color:#8a3324; cursor:pointer; text-decoration:underline\">Expand all<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ collapseD }}\" style=\"background:none; border:none; padding:0; font:inherit; color:#8a3324; cursor:pointer; text-decoration:underline\">Collapse all<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; overflow-x:auto; padding-bottom:8px\">\n            <sc-for list=\"{{ descRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n              <div style=\"display:flex; align-items:stretch; min-width:max-content\">\n                <sc-for list=\"{{ r.guides }}\" as=\"g\"><span style=\"flex:none; width:28px; display:flex; justify-content:center\"><span style=\"width:1px; background:#d8cdbb\"><\u002Fspan><\u002Fspan><\u002Fsc-for>\n                <span style=\"flex:none; width:36px; display:flex; align-items:center; justify-content:center\">\n                  <sc-if value=\"{{ r.hasToggle }}\"><button sc-camel-on-click=\"{{ r.onToggle }}\" style=\"width:26px; height:26px; border-radius:50%; border:1px solid #bfb39f; background:#fffdf8; color:#2a2521; font:inherit; font-size:16px; line-height:1; cursor:pointer; padding:0\">{{ r.toggleIcon }}<\u002Fbutton><\u002Fsc-if>\n                  <sc-if value=\"{{ r.noToggle }}\"><span style=\"width:7px; height:7px; border-radius:50%; background:#d8cdbb\"><\u002Fspan><\u002Fsc-if>\n                <\u002Fspan>\n                <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; margin:4px 0\">\n                  <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:flex; flex-direction:column; gap:3px; text-align:left; padding:9px 14px; background:{{ r.bg }}; border:1px {{ r.borderStyle }} {{ r.border }}; border-radius:4px; font:inherit; color:#2a2521; cursor:pointer; max-width:460px\">\n                    <span style=\"display:flex; align-items:center; gap:8px\"><span style=\"width:8px; height:8px; border-radius:50%; background:{{ r.branchColor }}; flex:none\"><\u002Fspan><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:16px; line-height:1.3\">{{ r.name }}<\u002Fspan><\u002Fspan>\n                    <span style=\"font-size:13px; color:#6e645a\">{{ r.sub }}<\u002Fspan>\n                    <sc-if value=\"{{ r.hasHint }}\"><span style=\"font-size:12px; color:#8a3324\">{{ r.hint }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fbutton>\n                  <sc-for list=\"{{ r.spouses }}\" as=\"sp\">\n                    <button sc-camel-on-click=\"{{ sp.onClick }}\" style=\"background:none; border:none; padding:0; font:inherit; font-size:13px; color:#8a3324; cursor:pointer\">m. {{ sp.name }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLineage }}\">\n        <div style=\"display:flex; flex-direction:column; gap:24px; max-width:820px\">\n          <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">The Abney line<\u002Fh2>\n          <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Jon's biological grandfather is Robert Lewis \"Bob\" Abney (1915–1983). Jon descends from Bob and Fannie Renner, not from Bob and his wife Edith, Fannie's sister. Family testimony and, Jon reports, his own AncestryDNA results confirm this. The original 1914 marriage record of Wesley Abney Jr. and Chessie Anglin names Wesley Jr.'s parents as Wesley and Louisa Ann, and Bob was born to Wesley Jr. and Chessie in 1915. Bob's parentage is very strongly supported, but no record naming his father has been found yet.<\u002Fp>\n          <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Further back, each parent–child link has its own evidence level, shown on its row. William Abney to Elijah is a working line. Everything above Lt. Paul D. Abney is a proposed online-genealogy pedigree, marked Unverified: the English gentry, the royal lines and the Carolingians. The colonial-to-England bridge isn't documented, and the route to King John depends on the disputed mother of Sir John Berkeley. None of this older ancestry is presented as proven. Click any name for their story.<\u002Fp>\n          <button sc-camel-on-click=\"{{ exploreAbney }}\" style=\"align-self:flex-start; padding:10px 16px; background:#2a2521; color:#f5f0e6; border:none; border-radius:3px; font:inherit; font-size:14px; cursor:pointer\">Explore as an expandable tree →<\u002Fbutton>\n          <div style=\"display:flex; flex-direction:column\">\n            <sc-for list=\"{{ lineageRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n              <div>\n                <sc-if value=\"{{ r.isEra }}\">\n                  <div style=\"padding:28px 0 10px; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a3324; border-bottom:1px solid #d8cdbb\">{{ r.era }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ r.isPerson }}\">\n                  <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"width:100%; display:grid; grid-template-columns:64px minmax(0,1fr); gap:14px; text-align:left; background:{{ r.bg }}; border:none; border-bottom:1px solid #e6dccb; padding:14px 8px; font:inherit; color:#2a2521; cursor:pointer\">\n                    <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:17px; color:#8a7f73\">{{ r.year }}<\u002Fspan>\n                    <span style=\"display:flex; flex-direction:column; gap:4px; min-width:0\">\n                      <span style=\"display:flex; flex-wrap:wrap; align-items:center; gap:8px\"><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:18px; line-height:1.3\">{{ r.name }}<\u002Fspan><sc-if value=\"{{ r.notable }}\"><span style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#5b4a7a; border:1px solid #5b4a7a; border-radius:20px; padding:2px 8px\">Notable<\u002Fspan><\u002Fsc-if><sc-if value=\"{{ r.hyp }}\"><span style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#5e554c; border:1px dashed #8a7f73; border-radius:20px; padding:2px 8px\">Unverified<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                      <span style=\"display:flex; flex-wrap:wrap; gap:4px 12px; font-size:13px\"><span style=\"color:#8a3324\">{{ r.rel }}<\u002Fspan><span style=\"color:{{ r.statusColor }}\">{{ r.statusLabel }}<\u002Fspan><\u002Fspan>\n                      <span style=\"font-size:14px; color:#5e554c; line-height:1.5; text-wrap:pretty\">{{ r.tagline }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRenner }}\">\n        <div style=\"display:flex; flex-direction:column; gap:24px; max-width:820px\">\n          <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">The Renner line<\u002Fh2>\n          <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Jon's Renner ancestry comes through his grandmother Fannie Renner. Her father, Robert Lee \"Bob\" Renner (1870–1947), was the son of John W. Renner and Sidney Arnold. Their names appear on the original death certificate of Robert's brother Logan, and Robert's 1947 obituary confirms Logan as his brother. Before John W., the line rests mainly on Jeff Renner's compiled research, census age patterns and land records. It's a strong case, but two links are still unproven.<\u002Fp>\n          <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Westerfield was probably Jacob Jr.'s eldest son, by a first wife whose name is unknown, not by Abigail Parsons. Jacob Sr. was probably the son of Adam Runner Sr. of Wythe County, Virginia. The German Lauffer line above Adam is a proposed pedigree from online trees. It has dashed outlines and Unverified labels, and DNA evidence argues against at least the tested Lauffer lines.<\u002Fp>\n          <button sc-camel-on-click=\"{{ exploreRenner }}\" style=\"align-self:flex-start; padding:10px 16px; background:#2a2521; color:#f5f0e6; border:none; border-radius:3px; font:inherit; font-size:14px; cursor:pointer\">Explore as an expandable tree →<\u002Fbutton>\n          <div style=\"display:flex; flex-direction:column\">\n            <sc-for list=\"{{ rennerRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n              <div>\n                <sc-if value=\"{{ r.isEra }}\">\n                  <div style=\"padding:28px 0 10px; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a3324; border-bottom:1px solid #d8cdbb\">{{ r.era }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ r.isPerson }}\">\n                  <button sc-camel-on-click=\"{{ r.onClick }}\" style=\"width:100%; display:grid; grid-template-columns:64px minmax(0,1fr); gap:14px; text-align:left; background:{{ r.bg }}; border:none; border-bottom:1px solid #e6dccb; padding:14px 8px; font:inherit; color:#2a2521; cursor:pointer\">\n                    <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:17px; color:#8a7f73\">{{ r.year }}<\u002Fspan>\n                    <span style=\"display:flex; flex-direction:column; gap:4px; min-width:0\">\n                      <span style=\"display:flex; flex-wrap:wrap; align-items:center; gap:8px\"><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:18px; line-height:1.3\">{{ r.name }}<\u002Fspan><sc-if value=\"{{ r.hyp }}\"><span style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#5e554c; border:1px dashed #8a7f73; border-radius:20px; padding:2px 8px\">Unverified<\u002Fspan><\u002Fsc-if><\u002Fspan>\n                      <span style=\"display:flex; flex-wrap:wrap; gap:4px 12px; font-size:13px\"><span style=\"color:#8a3324\">{{ r.rel }}<\u002Fspan><span style=\"color:{{ r.statusColor }}\">{{ r.statusLabel }}<\u002Fspan><\u002Fspan>\n                      <span style=\"font-size:14px; color:#5e554c; line-height:1.5; text-wrap:pretty\">{{ r.tagline }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRecords }}\">\n        <div style=\"display:flex; flex-direction:column; gap:26px\">\n          <div style=\"display:flex; flex-direction:column; gap:8px; max-width:820px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Records &amp; photographs<\u002Fh2>\n            <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Original records and photographs from Jon, kept under their original file names. Jeff Renner's maps and cemetery views are included for context on places. Each item notes what it proves and what it doesn't. Click an image to see it full size.<\u002Fp>\n          <\u002Fdiv>\n          <sc-for list=\"{{ recordGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <div style=\"padding-bottom:8px; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a3324; border-bottom:1px solid #d8cdbb\">{{ g.group }}<\u002Fdiv>\n              <sc-if value=\"{{ g.hasNote }}\"><p style=\"margin:0; max-width:820px; font-size:14px; line-height:1.55; color:#5e554c; text-wrap:pretty\">{{ g.note }}<\u002Fp><\u002Fsc-if>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:14px\">\n                <sc-for list=\"{{ g.items }}\" as=\"rc\">\n                  <div style=\"display:flex; flex-direction:column; gap:8px; padding:12px; background:#fbf8f2; border:1px solid #d8cdbb; border-radius:4px\">\n                    <button sc-camel-on-click=\"{{ rc.onOpen }}\" style=\"display:block; height:180px; padding:0; border:1px solid #d8cdbb; border-radius:3px; background:#2a2521; cursor:zoom-in; overflow:hidden\"><img src=\"{{ rc.src }}\" alt=\"{{ rc.title }}\" style=\"display:block; width:100%; height:100%; object-fit:cover; object-position:top\"><\u002Fbutton>\n                    <sc-if value=\"{{ rc.isFamily }}\"><span style=\"align-self:flex-start; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a3324; border:1px solid #8a3324; border-radius:20px; padding:2px 8px\">Your family<\u002Fspan><\u002Fsc-if>\n                    <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:16px; line-height:1.3\">{{ rc.title }}<\u002Fspan>\n                    <span style=\"font-size:13px; line-height:1.5; color:#4a423b; text-wrap:pretty\">{{ rc.desc }}<\u002Fspan>\n                    <span style=\"font-size:13px; line-height:1.5; color:#8a3324; text-wrap:pretty\">{{ rc.caution }}<\u002Fspan>\n                    <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n                      <sc-for list=\"{{ rc.people }}\" as=\"pp\"><button sc-camel-on-click=\"{{ pp.onClick }}\" style=\"padding:5px 9px; background:#f5f0e6; border:1px solid #d8cdbb; border-radius:3px; font:inherit; font-size:12px; color:#2a2521; cursor:pointer\">{{ pp.name }}<\u002Fbutton><\u002Fsc-for>\n                    <\u002Fdiv>\n                    <span style=\"font-size:12px; line-height:1.45; color:#6e645a; overflow-wrap:anywhere\">{{ rc.credit }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPhotos }}\">\n        <div style=\"display:flex; flex-direction:column; gap:22px\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid #d8cdbb\">\n            <sc-for list=\"{{ photoTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"padding:10px 16px; margin-bottom:-1px; background:none; border:none; border-bottom:2px solid {{ t.line }}; font:inherit; font-size:15px; color:{{ t.color }}; cursor:pointer\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ photoIsSplash }}\">\n            <div style=\"display:flex; flex-direction:column; gap:8px; max-width:760px\">\n              <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:30px\">Family photographs<\u002Fh2>\n              <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Choose a family to see its photos in order, oldest first. Or view every photo by year.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:20px\">\n              <sc-for list=\"{{ photoFamilies }}\" as=\"f\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"display:flex; flex-direction:column; padding:0; text-align:left; background:#fffdf8; border:1px solid #d8cdbb; border-radius:4px; overflow:hidden; font:inherit; color:#2a2521; cursor:pointer\" style-hover=\"box-shadow:0 6px 20px rgba(42,37,33,0.14); border-color:#bfb39f\">\n                  <div style=\"display:grid; grid-template-columns:1fr 1fr; grid-template-rows:120px 120px; gap:2px; background:#2a2521\">\n                    <sc-for list=\"{{ f.covers }}\" as=\"c\"><img src=\"{{ c.src }}\" alt=\"\" style=\"display:block; width:100%; height:100%; object-fit:cover; object-position:center 25%\"><\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:6px; padding:16px 18px 18px\">\n                    <div style=\"display:flex; align-items:center; gap:10px\">\n                      <span style=\"width:10px; height:10px; border-radius:50%; background:{{ f.color }}; flex:none\"><\u002Fspan>\n                      <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:22px\">{{ f.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"font-size:14px; color:#6e645a\">{{ f.meta }}<\u002Fspan>\n                    <span style=\"margin-top:6px; font-size:14px; color:#8a3324\">Explore photos →<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ photoIsList }}\">\n            <div style=\"display:flex; flex-direction:column; gap:8px\">\n              <sc-if value=\"{{ photoIsFamily }}\"><button sc-camel-on-click=\"{{ photoBack }}\" style=\"align-self:flex-start; background:none; border:none; padding:0; font:inherit; font-size:14px; color:#8a3324; cursor:pointer\">← All families<\u002Fbutton><\u002Fsc-if>\n              <div style=\"display:flex; align-items:center; gap:12px\">\n                <sc-if value=\"{{ photoIsFamily }}\"><span style=\"width:12px; height:12px; border-radius:50%; background:{{ photoFamColor }}; flex:none\"><\u002Fspan><\u002Fsc-if>\n                <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:30px\">{{ photoHeading }}<\u002Fh2>\n              <\u002Fdiv>\n              <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Oldest first. Open a photo to see who is who. Search or pick names to narrow it down.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center\">\n              <input value=\"{{ photoQuery }}\" sc-camel-on-change=\"{{ onPhotoQuery }}\" placeholder=\"Search by name…\" style=\"flex:0 1 320px; min-width:200px; padding:9px 12px; border:1px solid #d8cdbb; border-radius:3px; background:#fffdf8; font:inherit; font-size:15px; color:#2a2521\">\n              <button sc-camel-on-click=\"{{ toggleRestoredOnly }}\" style=\"padding:6px 13px; border-radius:999px; border:1px solid #8a3324; background:{{ restoredOnlyBg }}; color:{{ restoredOnlyColor }}; font:inherit; font-size:13px; cursor:pointer\">{{ restoredOnlyLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toggleThumbRestored }}\" style=\"padding:6px 13px; border-radius:999px; border:1px solid #bfb39f; background:{{ thumbRestoredBg }}; color:{{ thumbRestoredColor }}; font:inherit; font-size:13px; cursor:pointer\">{{ thumbRestoredLabel }}<\u002Fbutton>\n              <span style=\"font-size:14px; color:#6e645a\">{{ photoCount }}<\u002Fspan>\n              <sc-if value=\"{{ photoFiltered }}\"><button sc-camel-on-click=\"{{ clearPhotoFilters }}\" style=\"background:none; border:none; padding:0; font:inherit; font-size:14px; color:#8a3324; cursor:pointer; text-decoration:underline\">Clear filters<\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ photoIsYears }}\">\n              <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n                <sc-for list=\"{{ photoBranchChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:6px 12px; border-radius:20px; border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.color }}; font:inherit; font-size:13px; cursor:pointer\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <details style=\"border:1px solid #d8cdbb; border-radius:3px; background:#fffdf8; padding:10px 12px\">\n              <summary style=\"font-size:13px; color:#2a2521; cursor:pointer\">{{ photoPeopleLabel }}<\u002Fsummary>\n              <div style=\"display:flex; flex-wrap:wrap; gap:6px; padding-top:10px; max-height:320px; overflow-y:auto\">\n                <sc-for list=\"{{ photoNameChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:5px 10px; border-radius:3px; border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.color }}; font:inherit; font-size:13px; cursor:pointer\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdetails>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; align-items:center\">\n              <span style=\"font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#6e645a\">Jump to<\u002Fspan>\n              <sc-for list=\"{{ photoDecades }}\" as=\"g\"><button sc-camel-on-click=\"{{ g.jump }}\" style=\"padding:5px 11px; border-radius:3px; border:1px solid #d8cdbb; background:#fffdf8; font:inherit; font-size:13px; color:#2a2521; cursor:pointer\">{{ g.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ photoDecades }}\" as=\"g\" hint-placeholder-count=\"1\">\n              <div id=\"{{ g.id }}\" style=\"display:flex; flex-wrap:wrap; gap:14px 28px; padding-top:18px; border-top:1px solid #d8cdbb\">\n                <div style=\"flex:0 0 120px; display:flex; flex-direction:column; gap:4px\">\n                  <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:28px; color:#8a3324; line-height:1\">{{ g.label }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:#6e645a\">{{ g.count }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex:1 1 480px; min-width:0; display:flex; flex-wrap:wrap; gap:14px\">\n                  <sc-for list=\"{{ g.items }}\" as=\"ph\">\n                    <div style=\"flex:1 1 auto; max-width:100%; display:flex; flex-direction:column; gap:6px\">\n                      <button sc-camel-on-click=\"{{ ph.onOpen }}\" style=\"position:relative; display:block; padding:0; border:1px solid #d8cdbb; border-radius:3px; background:#2a2521; cursor:zoom-in; overflow:hidden\"><img src=\"{{ ph.thumb }}\" alt=\"{{ ph.title }}\" style=\"display:block; height:230px; width:100%; min-width:150px; object-fit:cover; object-position:center 25%\"><sc-if value=\"{{ ph.hasRestored }}\"><span style=\"position:absolute; left:8px; bottom:8px; padding:3px 8px; border-radius:999px; background:#8a3324; color:#f5f0e6; font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase\">{{ ph.restoredLabel }}<\u002Fspan><\u002Fsc-if><\u002Fbutton>\n                      <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:15px; line-height:1.3; text-wrap:pretty\">{{ ph.title }}<\u002Fspan>\n                      <span style=\"font-size:12px; color:#6e645a\">{{ ph.meta }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"flex:100 1 0; height:0\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noPhotos }}\"><p style=\"margin:0; font-size:14px; color:#6e645a\">No photos match. Try another name, or clear the filters.<\u002Fp><\u002Fsc-if>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPeople }}\">\n        <div style=\"display:flex; flex-direction:column; gap:18px\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Everyone in the record<\u002Fh2>\n            <span style=\"font-size:14px; color:#6e645a\">{{ peopleCount }}<\u002Fspan>\n          <\u002Fdiv>\n          <input value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Search by name…\" style=\"width:100%; max-width:420px; padding:10px 12px; border:1px solid #d8cdbb; border-radius:3px; background:#fffdf8; font:inherit; font-size:15px; color:#2a2521\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n            <sc-for list=\"{{ branchChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:6px 12px; border-radius:20px; border:1px solid {{ c.border }}; background:{{ c.bg }}; color:{{ c.color }}; font:inherit; font-size:13px; cursor:pointer\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; border-top:1px solid #d8cdbb\">\n            <sc-for list=\"{{ peopleRows }}\" as=\"p\" hint-placeholder-count=\"10\">\n              <button sc-camel-on-click=\"{{ p.onClick }}\" style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; text-align:left; background:{{ p.bg }}; border:none; border-bottom:1px solid #e6dccb; padding:12px 8px; font:inherit; color:#2a2521; cursor:pointer\">\n                <span style=\"display:flex; flex-direction:column; gap:2px; min-width:0\">\n                  <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:16px\">{{ p.name }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:#6e645a\">{{ p.dates }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display:flex; align-items:center; gap:6px; font-size:12px; color:#6e645a\"><span style=\"width:7px; height:7px; border-radius:50%; background:{{ p.branchColor }}\"><\u002Fspan>{{ p.branchLabel }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isResearch }}\">\n        <div style=\"display:flex; flex-direction:column; gap:32px; max-width:820px\">\n          <div style=\"display:flex; flex-direction:column; gap:14px; padding:22px 24px; background:#fbf8f2; border:1px solid #d8cdbb; border-radius:4px\">\n            <div style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a3324\">Research update · 2 October 2026<\u002Fdiv>\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">What's new in 2026<\u002Fh2>\n            <sc-for list=\"{{ update }}\" as=\"u\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex; flex-direction:column; gap:6px; padding-top:12px; border-top:1px solid #e6dccb\">\n                <h3 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:18px\">{{ u.h }}<\u002Fh3>\n                <p style=\"margin:0; font-size:15px; line-height:1.6; color:#2a2521; text-wrap:pretty\">{{ u.p }}<\u002Fp>\n                <sc-if value=\"{{ u.hasLinks }}\">\n                  <div style=\"display:flex; flex-wrap:wrap; gap:6px 8px; padding-top:2px\">\n                    <sc-for list=\"{{ u.links }}\" as=\"l\">\n                      <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"display:flex; align-items:center; gap:6px; padding:5px 11px; border:1px solid #d8cdbb; border-radius:3px; background:#fffdf8; font:inherit; font-size:13px; color:#8a3324; cursor:pointer\" style-hover=\"border-color:#8a3324; background:#f5eee2\"><span style=\"font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#6e645a\">{{ l.kind }}<\u002Fspan>{{ l.label }} →<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Where the records disagree<\u002Fh2>\n            <div style=\"display:flex; flex-direction:column; gap:14px\">\n              <sc-for list=\"{{ conflicts }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; flex-direction:column; gap:10px; padding:16px 18px; background:#fbf8f2; border:1px solid #d8cdbb; border-radius:4px\">\n                  <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"align-self:flex-start; background:none; border:none; padding:0; font-family:'Libre Caslon Text',Georgia,serif; font-size:17px; color:#2a2521; cursor:pointer; text-align:left; text-decoration:underline; text-decoration-color:#bfb39f\">{{ c.who }}<\u002Fbutton>\n                  <div style=\"display:flex; flex-direction:column; gap:4px\">\n                    <sc-for list=\"{{ c.claims }}\" as=\"cl\">\n                      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:2px 12px; font-size:14px; line-height:1.45\"><span style=\"color:#6e645a\">{{ cl.s }}<\u002Fspan><span style=\"color:#2a2521\">{{ cl.v }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"font-size:14px; line-height:1.5; color:#2a2521; padding-top:8px; border-top:1px solid #e6dccb; text-wrap:pretty\"><span style=\"font-weight:600\">Conclusion: <\u002Fspan>{{ c.conclusion }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">How we weigh evidence<\u002Fh2>\n            <div style=\"display:flex; flex-direction:column; border-top:1px solid #d8cdbb\">\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:4px 16px; padding:12px 4px; border-bottom:1px solid #e6dccb; font-size:14px; line-height:1.5\"><span style=\"font-weight:600; color:#2f6b3f\">Strongest<\u002Fspan><span>Original marriage, birth and death certificates; census images; Social Security applications; probate and deeds; newspapers of the time; gravestone photographs.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:4px 16px; padding:12px 4px; border-bottom:1px solid #e6dccb; font-size:14px; line-height:1.5\"><span style=\"font-weight:600; color:#3f6b5f\">Very useful<\u002Fspan><span>FamilySearch profiles, when backed by attached source documents. The documents are the proof, not the profile.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:4px 16px; padding:12px 4px; border-bottom:1px solid #e6dccb; font-size:14px; line-height:1.5\"><span style=\"font-weight:600; color:#9a6b1f\">Secondary<\u002Fspan><span>Cemetery transcriptions such as KyGenWeb.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:4px 16px; padding:12px 4px; border-bottom:1px solid #e6dccb; font-size:14px; line-height:1.5\"><span style=\"font-weight:600; color:#8a3324\">Clues only<\u002Fspan><span>Submitted genealogies, Find a Grave family links, PeopleLegacy and copied online trees.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Evidence labels on each person<\u002Fh2>\n            <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Key people have an Evidence list in their details. Each entry is tagged with one of these labels.<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; border-top:1px solid #d8cdbb\">\n              <sc-for list=\"{{ evLegend }}\" as=\"e\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:4px 16px; padding:12px 4px; border-bottom:1px solid #e6dccb; font-size:14px; line-height:1.5\"><span style=\"font-weight:600; color:{{ e.color }}\">{{ e.label }}<\u002Fspan><span>{{ e.desc }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Checked and ruled out<\u002Fh2>\n            <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">These records and claims look relevant but belong to someone else or don't hold up. They're listed here so nobody adds them back by mistake.<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; border-top:1px solid #d8cdbb\">\n              <sc-for list=\"{{ exclusions }}\" as=\"x\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:4px 16px; padding:12px 4px; border-bottom:1px solid #e6dccb; font-size:14px; line-height:1.5\"><span style=\"font-weight:600; color:#2a2521\">{{ x.t }}<\u002Fspan><span style=\"color:#4a423b; text-wrap:pretty\">{{ x.d }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Johnetta Cemetery visit — 30 Sep 2026<\u002Fh2>\n            <p style=\"margin:0; font-size:15px; line-height:1.6; color:#5e554c; text-wrap:pretty\">Jon photographed these readable Abney stones. Most aren't yet placed in the tree. Little Wesly's stone (1894–1914) was found on a later visit. Many of the oldest graves are plain rocks or badly weathered, and unreadable stones are not identified here.<\u002Fp>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px\">\n              <sc-for list=\"{{ stones }}\" as=\"st\" hint-placeholder-count=\"12\">\n                <div style=\"display:flex; flex-direction:column; gap:3px; padding:10px 12px; border:1px solid #e6dccb; border-radius:4px; background:#fbf8f2\">\n                  <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:15px\">{{ st.name }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:#5e554c\">{{ st.dates }}<\u002Fspan>\n                  <sc-if value=\"{{ st.hasNote }}\"><span style=\"font-size:12px; color:#8a3324\">{{ st.note }}<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Where we found it<\u002Fh2>\n            <sc-for list=\"{{ sourceGroups }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex; flex-direction:column; gap:0\">\n                <div style=\"padding:18px 0 8px; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#8a3324; border-bottom:1px solid #d8cdbb\">{{ g.kind }}<\u002Fdiv>\n                <sc-for list=\"{{ g.items }}\" as=\"src\">\n                  <div style=\"display:flex; flex-direction:column; gap:4px; padding:12px 4px; border-bottom:1px solid #e6dccb\">\n                    <sc-if value=\"{{ src.hasUrl }}\"><a href=\"{{ src.url }}\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:16px\">{{ src.label }}<\u002Fa><\u002Fsc-if>\n                    <sc-if value=\"{{ src.noUrl }}\"><span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:16px; color:#2a2521\">{{ src.label }}<\u002Fspan><\u002Fsc-if>\n                    <span style=\"font-size:14px; color:#5e554c; line-height:1.5; text-wrap:pretty\">{{ src.found }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px\">\n            <h2 style=\"margin:0; font-family:'Libre Caslon Text',Georgia,serif; font-weight:400; font-size:28px\">Still to find out<\u002Fh2>\n            <div style=\"display:flex; flex-direction:column; border-top:1px solid #d8cdbb\">\n              <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"8\">\n                <div style=\"display:grid; grid-template-columns:32px minmax(0,1fr); gap:10px; padding:12px 4px; border-bottom:1px solid #e6dccb\">\n                  <span style=\"font-family:'Libre Caslon Text',Georgia,serif; font-size:15px; color:#a0968a\">{{ q.n }}<\u002Fspan>\n                  <span style=\"font-size:15px; line-height:1.5; color:#2a2521; text-wrap:pretty\">{{ q.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showBackdrop }}\"><div sc-camel-on-click=\"{{ closePanel }}\" style=\"position:fixed; inset:0; background:rgba(42,37,33,0.35); z-index:20\"><\u002Fdiv><\u002Fsc-if>\n    <aside style=\"flex:0 1 400px; min-width:{{ asideMinW }}; position:{{ asidePos }}; top:{{ asideTop }}; right:0; width:{{ asideWidth }}; max-width:100vw; display:{{ asideDisplay }}; z-index:30; box-shadow:{{ asideShadow }}; max-height:{{ asideMaxH }}; height:{{ asideH }}; overflow:auto; background:#fbf8f2; border:1px solid #d8cdbb; border-radius:4px; padding:26px\">\n      <div style=\"display:flex; flex-direction:column; gap:16px\">\n        <sc-if value=\"{{ true }}\"><button sc-camel-on-click=\"{{ closePanel }}\" style=\"align-self:flex-end; background:none; border:1px solid #bfb39f; border-radius:3px; p
